<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>期货盯盘工作台 M3 · 五品种平铺</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  /* 三色语义（全站统一）：正面/多头/利多 = 红，中性/观望 = 黄，负面/空头/利空 = 绿。
     与国内盘面「涨红跌绿」一致；风险告警（止损已破 / 数据异常）仍用红，见 --risk。 */
  :root { --up:#C93B3B; --dn:#2E7D32; --muted:#88867F; --line:#E8E6E0; --ink:#222;
          --posBg:#FCEBEB; --posFg:#A32D2D;
          --neuBg:#FAEEDA; --neuFg:#854F0B;
          --negBg:#EAF3DE; --negFg:#3B6D11;
          --risk:#A32D2D; --riskBg:#FCEBEB; }
  * { box-sizing:border-box; margin:0; }
  body { font:13px/1.5 -apple-system,system-ui,"PingFang SC",sans-serif; background:#F7F6F3; color:var(--ink); padding:10px 12px 20px; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:500; }
  .dot { width:8px; height:8px; border-radius:50%; background:#BBB; }
  .dot.on { background:#2E7D32; } .dot.off { background:#C93B3B; }
  #srvtime { color:var(--muted); font-size:12px; }
  #sess { font-size:12px; padding:1px 8px; border-radius:10px; background:#EEE; color:var(--muted); }
  #sess.trading { background:#E1F5EE; color:#0F6E56; }

  .ticker { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .pill { background:#fff; border:0.5px solid var(--line); border-radius:8px; padding:3px 10px; font-size:12px; display:flex; gap:6px; align-items:center; }
  .pill b { font-weight:500; }
  .pill .cd { color:var(--muted); font-size:11px; }

  #alerts { min-height:0; margin-bottom:8px; }
  .alertbar { background:#FFF3E0; border:1px solid #EF9F27; color:#7A4A05; border-radius:8px; padding:4px 12px; display:inline-block; font-size:12px; }

  .ctrl { background:#fff; border:0.5px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:10px;
          display:flex; gap:8px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  .ctrl button, .ctrl input, .ctrl select { font:inherit; }
  .ctrl button { padding:3px 12px; border-radius:6px; border:0.5px solid #CCC; background:#fff; cursor:pointer; }
  .ctrl button.active { background:#185FA5; color:#fff; border-color:#185FA5; }
  .ctrl input[type=number] { width:88px; padding:3px 8px; border:0.5px solid #CCC; border-radius:6px; }
  .ctrl select { padding:3px 6px; border:0.5px solid #CCC; border-radius:6px; background:#fff; }
  .ctrl label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .sep { width:1px; height:18px; background:var(--line); margin:0 2px; }

  /* 五品种横排铺满: 下限 368px，容器够宽就 5 列一行（只有 5 张卡，auto-fit 不会超过 5 列）。
     窗口窄了自动退 4/3/2/1 列，不做横向滚动。 */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(368px,1fr)); gap:10px; }
  /* 超宽屏（≥2400）兜住上限：将来加第六个品种也只排 5 列，不多塞 */
  @media (min-width:2400px){ .grid { grid-template-columns:repeat(5,minmax(0,1fr)); } }
  .panel { background:#fff; border:0.5px solid var(--line); border-radius:10px; padding:8px 10px 6px; }
  /* 卡片头部固定两行：上排 名称/代码/价格/涨跌，下排 剧本·信号·仓位标签。
     原来 9 个元素挤在一个 flex-wrap 容器里，涨跌字数一变（+1 → -14）后面的标签就掉行，
     卡片高度跟着每次跳动抖一下。改成 grid 两行后行数恒定，价格用等宽数字不再左右窜。 */
  .ph { display:grid; grid-template-columns:auto auto auto 1fr auto;
        grid-template-areas:"nm code px chg max" "bgs bgs bgs bgs bgs";
        align-items:baseline; column-gap:8px; row-gap:3px; }
  /* 卡片最大化：右上角一枚图标钮，点击把整张卡片提到全屏弹层 */
  .ph .maxbtn { grid-area:max; align-self:start; justify-self:end; margin:-1px -2px 0 0;
                width:20px; height:20px; padding:0; line-height:1; border:0; border-radius:5px;
                background:transparent; color:#B7B2A6; cursor:zoom-in; display:flex;
                align-items:center; justify-content:center; }
  .ph .maxbtn:hover { background:#F2F0EA; color:#5F5E5A; }
  .panel.maximized .ph .maxbtn { cursor:zoom-out; }
  .ph .nm   { grid-area:nm;   font-size:14px; font-weight:500; white-space:nowrap; }
  .ph .code { grid-area:code; font-size:11px; color:var(--muted); white-space:nowrap; }
  .ph .px   { grid-area:px;   font-size:19px; font-weight:500; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ph .chg  { grid-area:chg;  font-size:12px; white-space:nowrap; overflow:hidden;
              font-variant-numeric:tabular-nums; }
  .ph .bgs  { grid-area:bgs;  display:flex; align-items:center; gap:5px; flex-wrap:wrap; min-width:0; }
  .ph .bgs .badge[data-wbtip] { cursor:help; }
  .badge[data-wbtip] { cursor:help; }   /* 任何带说明的标签都提示可悬停，别只限卡片头 */
  .ph .sp  { flex:1; }
  .sub { font-size:11.5px; color:var(--muted); line-height:1.6; }
  .sub b { color:#555; font-weight:500; }
  /* 量/仓/买/卖 四个数字高亮：一眼能扫到，买红卖绿沿用国内盘口习惯，
     量仓用蓝/紫与涨跌色区分开，避免和红绿行情混淆 */
  .sub b.q-vol { color:#1F6FEB; font-weight:700; }
  .sub b.q-oi  { color:#7C4DBE; font-weight:700; }
  .sub b.q-bid { color:var(--up); font-weight:700; }
  .sub b.q-ask { color:var(--dn); font-weight:700; }
  .chart { width:100%; height:300px; }
  .indsig { margin-top:2px; }
  .indsig button { font:inherit; font-size:11.5px; padding:2px 8px; border-radius:8px; border:0.5px solid #CCC; background:#fff; cursor:pointer; margin:2px 2px 0 0; }
  .indsig button.hit { background:#5b4a7a; color:#fff; border-color:#5b4a7a; }
  .indsig button.arm { background:#FAEEDA; }
  .chip { display:inline-block; font-size:11px; padding:1px 7px; border-radius:8px; background:#F1EFE8; color:#5F5E5A; margin-right:4px; cursor:pointer; }
  .chip.stop { background:#FCEBEB; color:#A32D2D; } .chip.support { background:#EAF3DE; color:#3B6D11; }
  .up { color:var(--up); } .dn { color:var(--dn); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px; font-weight:500; white-space:nowrap; }
  .b-fired { background:var(--posBg); color:var(--posFg); } .b-confirm { background:#FFF3E0; color:#7A4A05; }
  .b-near { background:var(--neuBg); color:var(--neuFg); }
  /* 中性/观望 = 黄（原来的灰看不出「中性」这层意思，和强多强空并列时像没判定） */
  .b-neu, .b-watch { background:var(--neuBg); color:var(--neuFg); }
  .b-hold { background:var(--neuBg); color:var(--neuFg); }   /* 持有区间内 = 中性状态 */
  .b-stop { background:var(--riskBg); color:var(--risk); }   /* 风险告警保留红 */
  /* 弱多 / 弱空：原来共用一档黄色，方向相反却同色；现在按红多绿空分开 */
  .b-weakup { background:#FCEEEE; color:#A05252; }
  .b-weakdn { background:#EDF4EC; color:#4A7150; }
  .b-weak { background:#F3F1EA; color:#7A7466; }
  /* 中性偏多 / 中性偏空：打分没过 ±2 阈值，结论仍算「中性」，但符号是偏的，
     颜色再全用黄就丢信息了 —— 按符号给一档更淡的红/绿，形成
     强/偏(红) → 中性偏多(淡红) → 中性(黄) → 中性偏空(淡绿) → 强/偏(绿) 的连续过渡。 */
  .b-mildup { background:#FDF2F0; color:#A85B4F; }
  .b-milddn { background:#F1F6EF; color:#517A57; }
  /* 持仓状态徽章（头部）：正面红 / 中性黄 / 负面绿，与下方持仓建议块同一套颜色 */
  .b-pos { background:var(--posBg); color:var(--posFg); }
  .b-neg { background:var(--negBg); color:var(--negFg); font-weight:600; }
  .b-negDeep { background:#DCEBDA; color:#2C5F33; font-weight:700; }
  /* 空头信号触发：绿底加粗描边，和做多触发（红底）一眼分开 */
  .b-firedS { background:#E6F2E9; color:#1F6B33; box-shadow:0 0 0 1px #7FB08C inset; font-weight:600; }
  table { border-collapse:collapse; font-size:12px; }
  td, th { border-bottom:0.5px solid var(--line); padding:3px 10px; text-align:left; }
  .del { color:#C93B3B; cursor:pointer; }
  #alog { max-height:110px; overflow:auto; font-size:12px; color:var(--muted); margin-top:6px; }

  /* 季节性日历 */
  .season { background:#fff; border:0.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .seasontbl { border-collapse:separate; border-spacing:3px; width:100%; table-layout:fixed; }
  .seasontbl th { font-size:11.5px; color:var(--muted); font-weight:400; text-align:center; padding:1px 0; border:0; }
  .seasontbl th.cur { color:#185FA5; font-weight:600; }
  .seasontbl th:first-child, .seasontbl td.nm { width:96px; }
  .seasontbl th:last-child, .seasontbl td.sum { width:104px; }
  .seasontbl td { border:0; padding:0; }
  .seasontbl td.nm { font-size:12.5px; text-align:left; white-space:nowrap; }
  .cell { border-radius:6px; padding:3px 2px; text-align:center; line-height:1.25; cursor:help; }
  .cell .v { font-size:12.5px; font-weight:500; }
  .cell .s { font-size:10px; color:#6B6A64; }
  .cell.na { background:#F5F4F0; color:var(--muted); }
  .seasontbl td.sum { font-size:10.5px; color:var(--muted); line-height:1.35; padding-left:6px; }

  /* 底部标签面板 */
  .tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
  .tabs button { font:inherit; padding:3px 12px; border-radius:6px; border:0.5px solid #CCC; background:#fff; cursor:pointer; }
  .tabs button.active { background:#185FA5; color:#fff; border-color:#185FA5; }
  .briefs { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:8px; }
  /* 四类简报一起铺：每组 = 一行标题 + 5 个品种小卡，组间用浅色分隔线断开 */
  .bgrp { margin-bottom:9px; }
  .bgrp+.bgrp { border-top:0.5px dashed #E6E2D8; padding-top:8px; }
  .bgrp-hd { display:flex; align-items:baseline; gap:8px; margin:0 0 4px 1px; flex-wrap:wrap; }
  .bgrp-hd b { font-size:12px; font-weight:600; color:#2C2A25; }
  .bgrp-hd span { font-size:10.5px; color:var(--muted); }
  .brief { border:0.5px solid var(--line); border-radius:8px; padding:6px 9px; background:#FCFBF8; }
  .brief h4 { font-size:12px; font-weight:600; margin-bottom:3px; color:#185FA5; }
  .brief p { font-size:11.5px; line-height:1.65; color:#4A4944; }
  .spreadgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; }
  .scard { border:0.5px solid var(--line); border-radius:8px; padding:7px 10px; }
  .scard .n { font-size:11px; color:var(--muted); }
  .scard .v { font-size:17px; font-weight:500; margin:1px 0; }
  .scard .note { font-size:10.5px; color:var(--muted); line-height:1.4; }
  .riskform { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .riskform input, .riskform select { font:inherit; padding:3px 8px; border:0.5px solid #CCC; border-radius:6px; }
  .riskform input[type=number] { width:96px; }
  .riskout { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:8px; margin-bottom:8px; }
  .riskout .k { font-size:11px; color:var(--muted); }
  .riskout .v { font-size:16px; font-weight:500; }
  .rules { font-size:11.5px; color:var(--muted); line-height:1.85; }
  .msg { display:flex; gap:8px; align-items:flex-start; border-bottom:0.5px solid var(--line); padding:5px 0; font-size:12px; }
  .tg { font-size:10.5px; padding:0 6px; border-radius:8px; white-space:nowrap; }
  .tg.bull { background:var(--posBg); color:var(--posFg); } .tg.bear { background:var(--negBg); color:var(--negFg); } .tg.neu { background:var(--neuBg); color:var(--neuFg); }
  .msglist { max-height:210px; overflow:auto; }
  .newslinks a { font-size:11.5px; color:#185FA5; margin-right:12px; text-decoration:none; }
  .warnbox { background:#FFF3E0; border:0.5px solid #EF9F27; color:#7A4A05; border-radius:6px; padding:3px 9px; font-size:11.5px; display:inline-block; margin:2px 6px 2px 0; }
  .jpanel { background:#fff; border:0.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; }
  /* 多空力量总表 */
  .ftab { width:100%; border-collapse:collapse; font-size:11.5px; }
  .ftab th { text-align:left; font-weight:500; color:var(--muted); font-size:11px; padding:4px 6px; border-bottom:0.5px solid var(--line); white-space:nowrap; }
  .ftab td { padding:5px 6px; border-bottom:0.5px solid #F5F3EE; white-space:nowrap; }
  .ftab tbody tr:last-child td { border-bottom:none; }
  .ftab .badge { font-size:10.5px; }

  /* 资金流向 */
  .flow { border-top:0.5px dashed var(--line); margin-top:6px; padding-top:5px; }
  .flow .line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:11.5px; }
  .flowbar { display:flex; height:15px; border-radius:4px; overflow:hidden; margin-top:4px; font-size:10px; color:#fff; font-weight:600; }
  .flowbar i { display:flex; align-items:center; justify-content:center; font-style:normal; }
  /* 持仓动作条：左侧挂标签，避免和下方「资金流向」那条长得一样分不清 */
  .barrow { display:flex; align-items:center; gap:5px; margin-top:4px; }
  .barrow .barlbl { flex:none; font-size:9px; color:#B4B2A9; letter-spacing:.3px; }
  .barrow .flowbar { flex:1; margin-top:0; }
  .barrow[data-wbtip] { cursor:help; }
  .flowbar.na i { background:#EDEBE5; color:#A8A69E; font-weight:400; }
  .b-strongup { background:#FCEBEB; color:#A32D2D; } .b-strongdn { background:#EAF3DE; color:#2E7D32; }
  /* 盘面倾向与剧本计划反向背离：橙色虚线描边提醒，不抢徽标本身的颜色语义 */
  .badge.contra { box-shadow:0 0 0 1.5px #E08A2E inset; border:1px dashed #E08A2E; }
  .b-weak { background:#FAEEDA; color:#854F0B; }
  /* 两块分栏：真实资金动向（持仓×价格）在上，资金流向估算（分钟级）在下，中间虚线断开 */
  .flow .sec { margin-top:5px; }
  .flow .sec + .sec { border-top:0.5px dotted #E0DED8; padding-top:4px; }
  .flow .ttl { display:flex; align-items:baseline; gap:5px; font-size:10px; font-weight:600; letter-spacing:.3px; color:#8A877E; }
  .flow .ttl .sm { font-weight:400; font-size:9px; color:#B4B2A9; letter-spacing:0; }
  .flow .ttl .v { margin-left:auto; font-size:11.5px; font-weight:600; white-space:nowrap; }
  /* 口径说明改悬停：虚下划线 + help 光标，一眼知道这里能问 */
  .flow .ttl[data-wbtip], .flow .flowbar[data-wbtip] { cursor:help; }
  /* 说明文字默认收起：标题右侧「明细」小按钮就地展开/收起（不再占版面） */
  .flow .ttl .fdbtn { margin-left:6px; flex:none; border:0; background:#F2F0EA; color:#8A877E;
                      font-family:inherit; font-size:9px; line-height:1.6; padding:0 5px;
                      border-radius:5px; cursor:pointer; letter-spacing:0; font-weight:400; }
  .flow .ttl .fdbtn:hover { background:#E6E3DA; color:#185FA5; }
  .flow .fdet { margin-top:1px; }
  .flow .ttl .v[data-wbtip] { cursor:help; border-bottom:0.5px dotted currentColor; padding-bottom:1px; }
  .flow .cells { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:3px 0 2px; }
  .flow .cell { border:0.5px solid var(--line); border-radius:5px; padding:2px 6px; background:#FCFBF8;
                font-size:11px; white-space:nowrap; overflow:hidden; }
  .flow .cell .k { font-size:9.5px; color:var(--muted); }
  /* 产业信号 */
  /* 标题单独放大：它是卡片里最后一块内容的入口，之前跟正文同为 11.5px 灰字，扫视时找不到 */
  .indhd { display:flex; justify-content:space-between; align-items:baseline; gap:6px;
           margin-top:8px; padding-left:7px; border-left:2.5px solid #8C7FB0;
           font-size:13.5px; font-weight:600; color:#4A4740; letter-spacing:.2px; line-height:1.35; }
  .indhd .cnt { font-size:12px; font-weight:600; letter-spacing:0; white-space:nowrap; }
  .indhd .n { font-size:10.5px; font-weight:400; color:#A8A69E; letter-spacing:0; }
  .sigrow .st { width:6px; height:6px; border-radius:50%; background:#DDD; flex:none; }
  .sigrow.hit .st { background:#5b4a7a; }
  /* 自动触发按「利多=红 / 利空=绿」上色，人工确认仍是紫（那是「人工标记」不是方向） */
  .sigrow.hit.dirup .st { background:var(--up); }
  .sigrow.hit.dirdn .st { background:var(--dn); }
  .sigrow .atag.hit.dirup { background:var(--posBg); border-color:#E3B0B0; color:var(--posFg); }
  .sigrow .atag.hit.dirdn { background:var(--negBg); border-color:#B7D6BD; color:var(--negFg); }
  .adetail.hit.dirup { background:#FBF3F3; border-left-color:#C93B3B; color:#6B3A3A; }
  .adetail.hit.dirdn { background:#F4F8F3; border-left-color:#2E7D32; color:#3C5B41; }
  .sigrow b { font-weight:500; flex:none; }
  .sigrow .cond { color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sigrow .src { color:#A8A69E; font-size:10.5px; flex:none; }
  .sigrow button { font-size:11px; padding:1px 8px; border-radius:8px; border:0.5px solid #CCC; background:#fff; cursor:pointer; flex:none; }
  .sigrow button.arm { background:#FAEEDA; border-color:#E0B96B; }
  .sigrow.hit button { background:#5b4a7a; color:#fff; border-color:#5b4a7a; }
  /* 自动判定信号：无按钮，用状态标签 */
  .sigrow .atag { font-size:10.5px; padding:1px 7px; border-radius:8px; flex:none;
                  border:0.5px solid #DDD; color:#8C8877; background:#FCFBF8; white-space:nowrap; }
  .sigrow .atag.hit { background:#5b4a7a; border-color:#5b4a7a; color:#fff; }
  .sigrow .atag.unknown, .sigrow .atag.ref { background:#FAEEDA; border-color:#E0B96B; color:#854F0B; }
  .sigrow .atag.ref { background:#F1F5F9; border-color:#CBD5E1; color:#475569; }
  .sigrow.arm .st { background:#E0B96B; }
  /* 信号行：名称 + 条件（省略）+ 状态，来源挪进详情条徽章，不再重复占一格 */
  .sigrow { display:flex; gap:6px; align-items:baseline; padding:4px 0 2px; border-top:0.5px solid #F0EEE8; font-size:12px; }
  /* 数据详情条：浅底 + 左侧状态色条（触发紫/待定橙/未触发灰），来源做成小徽章放行首 */
  .adetail { display:flex; gap:6px; align-items:flex-start; margin:0 0 4px 13px; padding:3px 8px 4px;
             background:#FAF9F4; border-left:2px solid #DDD9CB; border-radius:0 5px 5px 0;
             font-size:10.5px; color:#77736A; line-height:1.55; overflow-wrap:anywhere; }
  .adetail .dsrc { flex:none; font-size:9.5px; color:#8C8877; background:#F1EFE7;
                   border-radius:4px; padding:0 5px; margin-top:1px; white-space:nowrap; }
  .adetail.hit { background:#F6F4FA; border-left-color:#5b4a7a; color:#4C4658; }
  .adetail.hit .dsrc { background:#EBE7F2; color:#5b4a7a; }
  .adetail.arm { background:#FBF7EE; border-left-color:#E0B96B; color:#7A5E23; }
  .adetail.arm .dsrc { background:#F5EBD7; color:#854F0B; }

  /* 关键位阶梯（实时） */
  .ladder { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:5px 0 2px; }
  .lv { border:0.5px solid var(--line); border-radius:7px; padding:2px 6px 3px; background:#FCFBF8; position:relative; overflow:hidden; }
  .lv[data-wbtip] { cursor:help; }   /* 阶梯每档都带说明：状态含义 + 该档口径 */
  .lv .k { font-size:10.5px; color:var(--muted); display:flex; justify-content:space-between; align-items:baseline; gap:4px; }
  /* 五列并排时卡片会窄到 370px：四位价 + 涨跌幅挤不下，"最大 3851" 这类会撑破格子。
     用 flex-wrap 让涨跌幅在挤不下时换行，顶部对齐仍是一行，宁可多出一行也不裁字。 */
  .lv .v { font-size:15px; font-weight:600; line-height:1.25; letter-spacing:-0.2px;
           display:flex; flex-wrap:wrap; align-items:baseline; gap:0 3px; }
  .lv .d { font-size:10px; font-weight:400; color:var(--muted); white-space:nowrap; }
  .lv.res    .v { color:#A32D2D; }   /* 上方压力 = 红 */
  .lv.sup    .v { color:#5A8A3A; }   /* 下方支撑 = 绿 */
  .lv.strong .v { color:#3B6D11; }
  .lv.tgt    .v { color:#2E7D32; }   /* 下方失守目标 = 绿 */
  /* 最近的一档：整卡点亮，一眼看到此刻在博弈哪条线 */
  .lv.near { border-color:#EF9F27; background:#FFF8EC; box-shadow:0 0 0 1px #EF9F27 inset; }
  .lv.near .k { color:#7A4A05; font-weight:500; }
  .lv.broken { border-style:dashed; opacity:.72; }
  .lv.near { border-style:solid; }
  .lv.near.broken { opacity:1; }
  .lv .flag { position:absolute; top:0; right:0; font-size:9px; line-height:13px; padding:0 4px;
              border-bottom-left-radius:5px; background:#B4B2A9; color:#fff; }
  .lv.broken .flag { background:#8A8880; }
  .lv.near .flag { background:#EF9F27; }
  /* 口径标题：两套关键位标签一样，不写基准一定会看串 */
  .lvcap { display:flex; align-items:center; gap:5px; margin:5px 0 0; font-size:10px; color:var(--muted); }
  .lvcap .dot { width:5px; height:5px; border-radius:50%; flex:0 0 auto; }
  .lvcap .dot.y { background:#EF9F27; }
  .lvcap .dot.b { background:#378ADD; }
  .lvcap span:last-child { margin-left:auto; font-size:9.5px; color:#A8A69E; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 日内位用小一号卡片：它是"今天的锚"，不该跟波段位抢视觉重心 */
  .ladder.mini { margin:3px 0 1px; gap:3px; }
  .ladder.mini .lv { padding:1px 5px 2px; background:#FAFAF7; }
  .ladder.mini .lv .k { font-size:9.5px; }
  .ladder.mini .lv .v { font-size:12.5px; }
  .ladder.mini .lv .d { font-size:9px; }
  /* 窄卡片（5 列并排时约 371~420px）字号收一档。用容器查询而不是视口媒体查询：
     要判的是"卡片多宽"，窗口 1680 的时候卡片反而比 1920 时更宽。 */
  .panel { container-type:inline-size; }
  @container (max-width:405px){
    .lv { padding:2px 4px 3px; }
    .lv .k { font-size:10px; }
    .lv .v { font-size:13.5px; }
    .lv .d { font-size:9px; }
    .ladder.mini .lv .v { font-size:12px; }
    .ladder.mini .lv .k { font-size:9px; }
  }
  /* 触发状态整卡强调 */
  .panel.alarm { border-color:#C93B3B; box-shadow:0 0 0 1px rgba(201,59,59,.5) inset, 0 0 14px rgba(201,59,59,.13); }
  .panel.armed { border-color:#EF9F27; box-shadow:0 0 0 1px rgba(239,159,39,.45) inset; }
  /* 历史分位迷你条 */
  .pctbar { display:inline-block; width:46px; height:5px; border-radius:3px; background:#EDEBE5;
            vertical-align:middle; overflow:hidden; margin:0 3px 0 2px; }
  .pctbar i { display:block; height:100%; border-radius:3px; }
  /* 中储粮竞价块：只在玉米卡片出现 */
  .sino { margin:4px 0 1px; padding:4px 6px; background:#FBFAF6; border-left:2px solid #C9A227;
          border-radius:0 3px 3px 0; font-size:10px; line-height:1.55; color:#5A5A56; }
  .sino .hd { display:flex; align-items:center; gap:5px; font-size:10px; color:#8A6D1F; font-weight:600; }
  .sino .hd .tm { margin-left:auto; font-weight:400; color:#A8A69E; font-size:9px; }
  .sino b { color:#33322E; font-weight:600; }
  /* 五列并排时这一块只有 335px 宽，nowrap 会把"成交率/覆盖度"吃掉，改成可换行 */
  .sino .row { white-space:normal; overflow-wrap:anywhere; }
  .sino .k { color:#A8A69E; }
  /* 隆众产业数据块：与中储粮块同构（同一套 .sino 排版），只把左侧色条换成蓝灰，
     一眼能分出「这是隆众的周/日数据」而不是中储粮的竞价数据。 */
  .sino.lz { background:#F7F9FB; border-left-color:#4A6E8A; }
  .sino.lz .hd { color:#3F637D; }
  .sino.zc { background:#FBF8F4; border-left-color:#9C6B3F; }
  .sino.zc .hd { color:#7A5230; }
  .sino.ms { background:#F6FAF7; border-left-color:#4F7D5A; }
  .sino.ms .hd { color:#3D6247; }
  .sino .bad { color:#B8860B; }
  /* 季节性数值：自动算出，悬停看逐年样本 */
  .seas { cursor:help; border-bottom:1px dotted #CFCCC4; }
  /* 技术口径：从一坨 10.5px 灰字改成胶囊条——数据本来就在，只是被淹没在长段落里找不到 */
  .tech { display:flex; flex-wrap:wrap; gap:3px 7px; align-items:baseline;
          margin-top:5px; padding:4px 8px; background:#FAF8F2;
          border:0.5px solid var(--line); border-left:2px solid #C9C3B4;
          border-radius:0 4px 4px 0; cursor:help; }
  .tech .tc { font-size:10px; color:#7A766A; white-space:nowrap; }
  .tech .tc b { color:#33322C; font-weight:600; font-variant-numeric:tabular-nums; }
  .tech .tc.up b { color:#A32D2D; }   /* 趋势向上=红 */
  .tech .tc.dn b { color:#2E7D32; }   /* 趋势向下=绿 */
  .tech .tnote { font-size:9.5px; color:#A8A69E; margin-left:auto; white-space:nowrap; }

  /* ---------- 卡片全屏弹层 ----------
     做法是把真实的卡片 DOM 搬进弹层（不是复制），所有 id 与渲染逻辑不变，
     关闭时搬回原位；原位留一块虚线占位，避免其余卡片重排。 */
  #maxwrap { position:fixed; inset:0; z-index:9000; display:none; flex-direction:column;
             background:#F7F5F0; }
  #maxwrap.on { display:flex; }
  .maxbar { display:flex; align-items:center; gap:10px; padding:7px 14px;
            border-bottom:0.5px solid var(--line); background:#fff; flex:none; }
  .maxbar .mt { font-size:13px; font-weight:600; color:#2C2A25; }
  .maxbar .mhint { font-size:11px; color:var(--muted); margin-left:auto; }
  #maxclose { font:inherit; font-size:12px; padding:3px 12px; border-radius:8px;
              border:0.5px solid #CCC; background:#fff; cursor:pointer; color:#444; }
  #maxclose:hover { background:#F2F0EA; }
  #maxslot { flex:1; overflow:auto; padding:12px 14px 18px; }
  #maxslot .panel { max-width:1680px; margin:0 auto; }
  #maxslot .panel .chart { height:clamp(300px, 50vh, 620px); }
  #maxslot .panel .ph .nm { font-size:17px; }
  #maxslot .panel .ph .px { font-size:26px; }
  #maxslot .panel .ph .chg { font-size:13.5px; }
  .panel-ph { border:0.5px dashed #D6D0C0; border-radius:10px; background:#FBFAF6;
              display:flex; flex-direction:column; align-items:center; justify-content:center;
              gap:6px; color:#B3AFA3; font-size:12px; cursor:zoom-in; }
  .panel-ph:hover { border-color:#B9B2A0; color:#8C8779; }
  body.maxing { overflow:hidden; }

  /* ---------- 悬停说明浮层 ----------
     原生 title 是浏览器画的：黄底小字、1 秒延迟、换行全靠浏览器、没法定层级和排版。
     这里改成自绘：顶部一条按语义取色的色条（红=风险/触发、橙=预警、绿=持仓/多），
     标题行把「键 数值」拆成胶囊，正文按「键：值」两列对齐，长句自动换行。 */
  #wbtip {
    position:fixed; left:0; top:0; z-index:9999;
    max-width:min(408px, calc(100vw - 24px)); max-height:calc(100vh - 24px);
    background:#FFFDFA; border:0.5px solid #D8D2C2; border-radius:10px;
    box-shadow:0 10px 28px rgba(52,44,28,.15), 0 2px 6px rgba(52,44,28,.08);
    font:12px/1.6 -apple-system,system-ui,"PingFang SC",sans-serif; color:#2C2A25;
    opacity:0; visibility:hidden; transform:translateY(3px);
    transition:opacity .12s ease, transform .12s ease;
    pointer-events:none; overflow:hidden;
  }
  #wbtip.on { opacity:1; visibility:visible; transform:none; }
  #wbtip .bar { height:3px; background:var(--ac,#C9C4B6); }
  #wbtip .bd { padding:8px 11px 9px; }
  #wbtip .hd { font-size:12.5px; font-weight:600; margin-bottom:5px; color:#232019;
               display:flex; flex-wrap:wrap; align-items:center; gap:4px 5px; }
  #wbtip .pg { display:inline-flex; align-items:baseline; gap:4px; background:#F3F0E7;
               border-radius:5px; padding:1px 7px; font-size:11.5px; font-weight:500; color:#4A463C; }
  #wbtip .pg em { font-style:normal; color:#8B8577; font-weight:400; }
  #wbtip .rw { display:grid; grid-template-columns:4.9em minmax(0,1fr); gap:2px 9px; padding:1px 0; }
  #wbtip .rw + .rw { border-top:0.5px solid #F1EDE3; }
  #wbtip .k { color:#9C9585; font-size:11.5px; white-space:nowrap; }
  #wbtip .v { color:#3A3730; overflow-wrap:anywhere; }
  #wbtip .li { color:#3A3730; padding:1px 0; }
  #wbtip .hr { height:1px; background:#EEEAE0; margin:6px 0 5px; }
  /* 持仓建议：三档并行（短线止损/波段止损/目标位），现价实时标状态。
     与关键位阶梯分开：阶梯管"在哪做"，这里管"已有仓位怎么管"。 */
  .adv { margin:6px 0 2px; padding:5px 7px 6px; background:#FBFAF6;
         border:0.5px solid var(--line); border-radius:7px; }
  .adv:empty { display:none; }
  .adv .ahd { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
              color:#6E6A5F; letter-spacing:.2px; }
  .adv .ast { margin-left:auto; font-size:10px; font-weight:600; padding:1px 7px;
              border-radius:8px; white-space:nowrap; }
  /* 持仓状态：中性（持有区间内）=黄，正面（目标到达）=红，负面（止损已破，价格走反）=绿。
     破位仍保留 ⚠️ 与加粗，警示靠图标和文案，不靠红色（红已经固定表示「往上」）。 */
  .adv .ast.hold { background:var(--neuBg); color:var(--neuFg); }
  .adv .ast.warn { background:var(--negBg); color:var(--negFg); font-weight:600; }
  .adv .ast.bad  { background:#DCEBDA; color:#2C5F33; font-weight:700; }
  .adv .ast.good { background:var(--posBg); color:var(--posFg); }
  /* 我的仓位切换：跟在「持仓建议」同一行右侧，分段控件样式（不额外占行）。
     选中项深底白字；不选（顺趋势）= 按盘面方向给建议（老行为）。 */
  .adv .possw { display:inline-flex; margin-left:6px; border:0.5px solid #D6D0C0; border-radius:5px;
                overflow:hidden; background:#fff; flex:none; }
  .adv .possw b { font-size:9.5px; font-weight:500; color:#6E6A5F; padding:1.5px 5px;
                  cursor:pointer; white-space:nowrap; border-left:0.5px solid #E7E2D5;
                  transition:background .12s, color .12s; }
  .adv .possw b:first-child { border-left:0; }
  .adv .possw b:hover { background:#F3F0E7; color:#33322C; }
  .adv .possw b.on { background:#33322C; color:#fff; font-weight:600; }
  .adv .possw b.on:hover { background:#33322C; color:#fff; }
  .adv .ctr { font-style:normal; margin-left:4px; font-size:9px; font-weight:600;
              padding:1px 5px; border-radius:7px; background:#FBE9E9; color:#A32D2D; }
  .adv .agrid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:5px; }
  .adv .ac { background:#fff; border:0.5px solid var(--line); border-radius:5px; padding:2px 5px 3px; min-width:0; }
  .adv .ac .k { font-size:9.5px; color:var(--muted); white-space:nowrap; }
  .adv .ac .v { font-size:13px; font-weight:600; letter-spacing:-.2px; color:#33322C;
                font-variant-numeric:tabular-nums; }
  .adv .ac .d { font-size:9px; color:#A8A69E; white-space:nowrap; }
  /* 价位格按「相对现价在上还是在下」上色：上方=红、下方=绿（与涨跌同色系）。
     空单的止损在上方→红、目标在下方→绿；多单镜像。 */
  .adv .ac.u .v { color:var(--posFg); }
  .adv .ac.d .v { color:var(--negFg); }
  .adv .ac.brk.u { background:#FDF1F1; border-color:#E3B0B0; }
  .adv .ac.brk.d { background:#F1F7F0; border-color:#B7D6BD; }
  .adv .ac.brk.u .v, .adv .ac.brk.u .d { color:var(--posFg); }
  .adv .ac.brk.d .v, .adv .ac.brk.d .d { color:var(--negFg); }
  .adv .ac.hit.u { background:#FDF1F1; border-color:#E3B0B0; }
  .adv .ac.hit.d { background:#F1F7F0; border-color:#B7D6BD; }
  .adv .ac.hit.u .v, .adv .ac.hit.u .d { color:var(--posFg); }
  .adv .ac.hit.d .v, .adv .ac.hit.d .d { color:var(--negFg); }
  .adv .ac.near { border-color:#E0B96B; background:#FFFBF0; }
  .adv .ac.near .d { color:var(--neuFg); }

  /* 基差面板：现货/期货/基差/历史分位四格 + 自动判定 + 原手写口径备注。
     为什么要有这块：原来弹层里只有一句人工写的「现货约3.8元/斤，深贴水」，
     而上面行情行是实时抓来的基差数值，两处对不上、也没说清贴水深不深、该往哪边想。 */
  .bb { margin:3px 0 7px; padding:6px 8px 7px; background:#FBFAF6;
        border:0.5px solid var(--line); border-radius:7px; }
  .bb .bbhd { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:#6E6A5F; }
  .bb .bgrade { margin-left:auto; font-size:9.5px; font-weight:600; padding:1px 6px; border-radius:8px; white-space:nowrap; }
  /* 基差深浅：贴水（正基差，利多盘面）=红系，升水（负基差，压制盘面）=绿系，平水=黄 */
  .bb .bgrade.up   { background:var(--posBg); color:var(--posFg); }
  .bb .bgrade.dn   { background:var(--negBg); color:var(--negFg); }
  .bb .bgrade.flat { background:var(--neuBg); color:var(--neuFg); }
  .bb .bbgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:5px; }
  .bb .bc { background:#fff; border:0.5px solid var(--line); border-radius:5px; padding:2px 5px 3px; min-width:0; }
  .bb .bc .k { font-size:9.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bb .bc .v { font-size:13px; font-weight:600; letter-spacing:-.2px; color:#33322C; font-variant-numeric:tabular-nums; }
  .bb .bc .v.up { color:#A32D2D; }
  .bb .bc .v.dn { color:#2E7D32; }
  .bb .bc .d { font-size:9px; color:#A8A69E; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bb .bbnote { margin-top:4px; font-size:10.5px; line-height:1.55; color:#5E5A50; }
  .bb .bbmemo { margin-top:3px; font-size:9.5px; line-height:1.5; color:#A19C90; }
  .bb .bbspark { display:flex; align-items:flex-end; gap:1.5px; height:22px; margin-top:5px; }
  .bb .bbspark i { flex:1; min-width:0; border-radius:1px; opacity:.75; }

  /* 主线/基差/季节性/技术位：默认收起成一行，点开弹层看详情 */
  .thesisbar { display:flex; align-items:center; gap:6px; font-size:12px; color:#9A9384;
               cursor:pointer; padding:2px 0 3px; user-select:none; transition:color .12s; }
  .thesisbar:hover { color:#185FA5; }
  .thesisbar .arr { font-size:13px; opacity:.7; }
  .tmodal { position:fixed; inset:0; background:rgba(24,22,18,.3); z-index:120;
            display:none; align-items:center; justify-content:center; padding:24px; }
  .tmodal.on { display:flex; }
  .tmodal .box { background:#fff; border-radius:10px; width:min(760px,100%); max-height:82vh;
                 display:flex; flex-direction:column; box-shadow:0 14px 40px rgba(0,0,0,.18); }
  .tmodal .hd { display:flex; align-items:center; gap:8px; padding:9px 14px;
                border-bottom:0.5px solid var(--line); font-size:13px; font-weight:600; color:#232019; }
  .tmodal .hd button { margin-left:auto; border:0; background:#F2F0EA; color:#7A7466; width:22px; height:22px;
                       border-radius:6px; cursor:pointer; font-size:12px; line-height:1; }
  .tmodal .hd button:hover { background:#E6E3DA; color:#232019; }
  .tmodal .bd { padding:12px 15px 16px; overflow:auto; font-size:12.5px; line-height:1.85; color:#3A3730; }
  .tmodal .bd .tech { display:inline-flex; }
</style>
</head>
<body>
<header>
  <h1>期货盯盘工作台 · 五品种平铺</h1>
  <span class="dot off" id="dot"></span><span id="wstat">连接中</span>
  <span id="sess">--</span>
  <span id="srvtime"></span>
  <span class="sub">只记录数据，不构成投资建议</span>
</header>

<div class="ticker" id="ticker"></div>
<div id="alerts"></div>

<div class="ctrl">
  <span class="sub">周期</span>
  <button data-p="60" class="active">1分钟</button>
  <button data-p="300">5分钟</button>
  <button data-p="86400">日线</button>
  <span class="sep"></span>
  <label><input type="checkbox" id="showMA" checked>MA5/10/20</label>
  <label><input type="checkbox" id="showBOLL" checked>BOLL</label>
  <label><input type="checkbox" id="showMACD" checked>MACD</label>
  <span class="sep"></span>
  <span class="sub">价位线</span>
  <select id="pl-sym"></select>
  <input id="pl-price" type="number" step="0.5" placeholder="价格">
  <select id="pl-type">
    <option value="support">支撑</option>
    <option value="resist">压力</option>
    <option value="stop">止损</option>
  </select>
  <button id="pl-add">添加</button>
  <span class="sub">触达即声音+高亮</span>
</div>

<div class="grid" id="grid"><div class="panel sub" style="padding:20px">正在连接行情…</div></div>

<div id="maxwrap" aria-hidden="true">
  <div class="maxbar">
    <span class="mt" id="maxttl"></span>
    <span class="mhint">行情照常刷新 · Esc 或点击空白处退出</span>
    <button id="maxclose">还原 ✕</button>
  </div>
  <div id="maxslot"></div>
</div>

<div class="season">
  <div class="ph" style="margin-bottom:6px">
    <b>季节性日历</b>
    <span class="sub" id="season-note">1–12 月历史月均涨跌强弱 · 红强绿弱 · 悬停看逐年明细</span>
  </div>
  <div id="season-body"><div class="sub">正在加载季节性数据…</div></div>
</div>

<!-- 多空力量总表：不再折叠进标签页，常驻显示在时报简报上方（盯盘时不想为看一眼对比再点一下） -->

<script>
const state = {
  quotes:{}, klines:{}, pbBySymbol:{}, confirmBars:3, nearPct:0.01,
  period:"60", lines:{}, lastAlert:{}, indHit:{}, indArm:null, journal:[], season:null,
  auto:{}, autoSeen:{}, sino:null, zc:null, ms:null, zc:null, lz:null,
  order:[], charts:{}, lastDraw:{}
};
const LEVEL_LABEL = {resistance:'压力', firstSupport:'支撑1', strongSupport:'支撑2', stopTarget:'止损位',
                     longTriggerBreak:'多突破', longPullback:'多回踩', shortBreakdown:'空破位', shortFadeZone:'滞涨区'};

let actx=null;
let lastPanel=0;
function beep(times=2){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){
      const o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.frequency.value=880;
      const t=actx.currentTime+i*0.25;
      g.gain.setValueAtTime(0.25,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t); o.stop(t+0.22);
    }
  }catch(e){}
}

function tradingSession(){
  const d=new Date(Date.now()+ (8*60 + new Date().getTimezoneOffset())*60000);
  const day=d.getDay(), m=d.getHours()*60+d.getMinutes();
  if(day===0||day===6) return false;
  return [[540,615],[630,690],[810,900],[1260,1380]].some(([a,b])=>m>=a&&m<b);
}

/* ---------- 指标 ---------- */
function sma(a,n){ const o=[]; let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=n)s-=a[i-n]; o.push(i>=n-1?s/n:null);} return o; }
function boll(a,n=20,k=2){ const mid=[],up=[],lo=[];
  for(let i=0;i<a.length;i++){ if(i<n-1){mid.push(null);up.push(null);lo.push(null);continue;}
    const w=a.slice(i-n+1,i+1), m=w.reduce((x,y)=>x+y)/n;
    const sd=Math.sqrt(w.reduce((x,y)=>x+(y-m)**2,0)/n);
    mid.push(m); up.push(m+k*sd); lo.push(m-k*sd);} return {mid,up,lo}; }
function ema(a,n){ const k=2/(n+1); const o=[]; let e=null;
  for(let i=0;i<a.length;i++){ e=e===null?a[i]:a[i]*k+e*(1-k); o.push(e);} return o; }
function macd(a){ const e12=ema(a,12), e26=ema(a,26);
  const dif=a.map((_,i)=>e12[i]-e26[i]); const dea=ema(dif,9);
  return {dif,dea,hist:dif.map((v,i)=>2*(v-dea[i]))}; }

/* ---------- 信号状态机 ----------
   每个 return 都带四个字段：label（标签）、detail（一句话现状）、
   rule（判定规则，为什么落到这个标签）、next（下一步怎么办）。
   detail 显示在卡片下方，rule/next 走标签悬停——标签只有四个字，依据必须能查。 */
function scriptSignal(closes, price, lv, nearPct, N, side, atr){
  if(!lv || !price) return {state:'watch', label:'--', detail:'', rule:'', next:''};
  if(side==='long' && lv.longTriggerBreak==null)
    return {state:'watch', label:'观望', detail:'多头剧本未配置关键位',
      rule:'剧本里没给「多突破位」（价格站上它才算转强的那个价），无法判定突破',
      next:'在 playbook.json 补上「多突破位 / 多回踩位」后才会出信号'};
  if(side==='short' && lv.shortBreakdown==null && !lv.shortFadeZone)
    return {state:'watch', label:'观望', detail:'空头剧本未配置关键位',
      rule:'剧本里既没给「空破位」（跌破才算转弱）也没给「滞涨区」（反弹到这里涨不动就试空）',
      next:'补上破位价或滞涨区后才能判定'};
  const streak = (cond)=>{ let s=0; for(let i=closes.length-1;i>=0&&cond(closes[i]);i--) s++; return s; };
  const lag = atr? Math.round(0.3*atr) : null;      // 滞后降级阈值（0.3×ATR）
  if(side==='long'){
    const brk=lv.longTriggerBreak, pb=lv.longPullback;
    if(closes.length){
      const st=streak(c=>c>brk);
      if(st>0){
        // 滞后突破降级：已跑出 0.3×ATR 以上不算"新触发"，追高赔率差
        if(st>=N && atr && price >= brk + 0.3*atr)
          return {state:'near', label:'⚪ 已突破·等回踩',
            detail:`现价高出突破位 ${brk} 超过 0.3×ATR，属滞后突破——不追多，等回踩 ${brk} 企稳再进`,
            rule:`连续 ${st} 根收盘已站上 ${brk}（≥${N} 根成立），但现价已高出 ${brk} 超过 0.3×ATR（≈${lag} 点）——追进去等于买在突破后的高位，判定降级为「等回踩」`,
            next:`不追多。等回踩 ${brk} 不破 + 1 分钟收阳再进；若直接在 ${brk+lag} 上方放量续涨，那是新趋势，按回踩不破重新评估`};
        return {state: st>=N?'fired':'confirming',
          label: st>=N?'🔴 多头突破触发':`突破确认中 ${st}/${N}`,
          detail: st>=N?`已连续 ${st} 根站稳 ${brk}，满足进场条件`:`现价刚站上 ${brk}，持续站稳才确认——别急`,
          rule: st>=N
            ? `连续 ${st} 根 K线收盘 > ${brk}，达到 ${N} 根确认门槛，且未跑出 0.3×ATR（≤${lag} 点），属有效突破`
            : `收盘已站上 ${brk}，但只连续 ${st} 根 < ${N} 根门槛——可能是插针，先不动手`,
          next: st>=N
            ? `按剧本机位进场，止损同步挂上；跌回 ${brk} 下方视为假突破，立即撤`
            : `等满 ${N} 根不跌回 ${brk} 下方再进，或等回踩 ${brk} 企稳`};
      }
    }
    if(Math.abs(price-brk)/brk<=nearPct)
      return {state:'near', label:'🟡 接近突破位', detail:`距突破 ${brk} 不足1%`,
        rule:`现价与突破位 ${brk} 的距离 ≤ ${(nearPct*100).toFixed(1)}%，但还站在 ${brk} 下方`,
        next:`盯放量站上 ${brk}，连续 ${N} 根不回落才算触发；站上去又掉下来就是假突破`};
    if(Math.abs(price-pb)/pb<=nearPct)
      return {state:'near', label:'🟡 接近回踩位', detail:`距回踩 ${pb} 不足1%，企稳再上`,
        rule:`现价与回踩位 ${pb} 的距离 ≤ ${(nearPct*100).toFixed(1)}%（回踩做多的第二机位）`,
        next:`在 ${pb} 企稳（不创新低 + 收阳）可轻仓试多，实体跌破 ${pb} 则等下一条支撑`};
    return {state:'watch', label:'观望', detail:`未触及 ${brk}/${pb}，等信号`,
      rule:`既未站上突破位 ${brk}，也不在 ${brk} 或回踩位 ${pb} 的 ${(nearPct*100).toFixed(1)}% 邻域内——中间地带动手没有参照物`,
      next:`等价格走到 ${pb} 或 ${brk} 再看，中间区域不动手`};
  } else {
    const brk=lv.shortBreakdown, fz=lv.shortFadeZone;
    if(closes.length){
      const st=streak(c=>c<brk);
      if(st>0){
        if(st>=N && atr && price <= brk - 0.3*atr)
          return {state:'near', label:'⚪ 已破位·等反抽',
            detail:`现价低于破位位 ${brk} 超过 0.3×ATR，属滞后破位——不追空，等反抽 ${brk} 附近滞涨再试`,
            rule:`连续 ${st} 根收盘已跌破 ${brk}（≥${N} 根成立），但现价已低于 ${brk} 超过 0.3×ATR（≈${lag} 点）——此处追空等于卖在破位后的低位，判定降级为「等反抽」`,
            next:`不追空。等反抽到 ${brk} 附近滞涨（分钟级冲高回落/长上影）再试空；反抽重新站回 ${brk} 上方，说明破位失败，剧本作废`};
        return {state: st>=N?'fired':'confirming',
          label: st>=N?'🟢 空头破位触发':`破位确认中 ${st}/${N}`,
          detail: st>=N?`已连续 ${st} 根跌破 ${brk}，满足进场条件`:`现价刚跌破 ${brk}，持续在下方才确认——别抢跑`,
          rule: st>=N
            ? `连续 ${st} 根 K线收盘 < ${brk}，达到 ${N} 根确认门槛，且未跌出 0.3×ATR（≥${brk-lag}），属有效破位`
            : `收盘已跌破 ${brk}，但只连续 ${st} 根 < ${N} 根门槛——可能是假摔，先不动手`,
          next: st>=N
            ? `按剧本机位进场，止损挂回 ${brk} 上方；重新站回 ${brk} 视为假破位，立即撤`
            : `等满 ${N} 根不收回 ${brk} 上方再进，或等反抽 ${brk} 滞涨`};
      }
    }
    if(fz && price>=fz[0] && price<=fz[1])
      return {state:'near', label:'🟡 滞涨区试空', detail:`进入 [${fz[0]}, ${fz[1]}] 滞涨区，滞涨可试空`,
        rule:`现价落在剧本反弹滞涨区 [${fz[0]}, ${fz[1]}] 内——破位前的最后一道压力带，空头性价比最高的位置`,
        next:`等滞涨信号（冲高回落 / 长上影 / 1 分钟转阴）轻仓试空，止损放 ${fz[1]} 上方；放量突破 ${fz[1]} 则空头剧本暂停`};
    if(Math.abs(price-brk)/brk<=nearPct)
      return {state:'near', label:'🟡 接近破位', detail:`距破位 ${brk} 不足1%，跌破且放量即触发`,
        rule:`现价与破位位 ${brk} 的距离 ≤ ${(nearPct*100).toFixed(1)}%，但尚未跌破`,
        next:`盯 ${brk} 下方：连续 ${N} 根收盘跌破且放量才追，缩量假摔不追`};
    return {state:'watch', label:'观望', detail:`未破 ${brk}、不在滞涨区，等信号`,
      rule:`未跌破 ${brk}，也不在滞涨区 [${fz?fz.join(', '):'--'}] 内——既没破位也没到空头好位置`,
      next:`等反抽到 ${fz?fz.join('-')+' 滞涨':'滞涨区'} 或跌破 ${brk} 再看`};
  }
}
/* 持仓/目标状态标签。判定顺序即优先级：先看止损（剧本失效）→ 再看趋势目标 → 波段目标 → 都没到就是"持有区间内"。
   趋势目标比波段目标远，所以必须先判趋势，否则价格冲过趋势目标时会被误标成"波段目标到达"。
   四档全部带上 tip：标签只有四个字，为什么是这个结论要靠悬停看具体价位。 */
/* 持仓状态判定 —— 头部徽章与下方「持仓建议」块共用这一个函数。
   为什么必须共用：原来头部按「开仓计划 plan.stop」判、下方按「持仓建议 advice」判，
   两套价位差一个 ATR 量级（plan.stop 是入场位上方 0.5ATR，advice.shortStop 是 MA5），
   于是出现「上面写短线止损已破、下面写持有区间内」的自相矛盾。
   方向不靠价位结构推：区间震荡的止损在目标下方，用价位推会翻成多头，直接看文案里有没有「空头」。 */
function adviceState(a, price){
  const bear=adviceBearish(a);
  // 档位为 null 表示"该档不适用"（如空仓观望时不给波段止损），不能当成 0 参与比较，
  // 否则 price>=null 恒真，会凭空报"波段止损已破"。
  const shortBroken = a.shortStop!=null && (bear ? price>=a.shortStop : price<=a.shortStop);
  const swingBroken = a.swingStop!=null && (bear ? price>=a.swingStop : price<=a.swingStop);
  const hit = t => t!=null && (bear ? price<=t : price>=t);
  const p=Number(price).toFixed(0);
  if(swingBroken) return {k:'bad', t:'波段止损已破 ⚠️',
    why:`现价 ${p} 已${bear?'上破':'跌破'}波段止损 ${a.swingStop}（趋势生命线），整笔前提不成立`};
  if(shortBroken) return {k:'warn', t:'短线止损已破 ⚠️',
    why:`现价 ${p} 已${bear?'上破':'跌破'}短线止损 ${a.shortStop}（短线动能证伪），波段止损 ${a.swingStop??'--'} 尚未破`};
  if(hit(a.trendTarget)) return {k:'good', t:'趋势目标到达 ✓',
    why:`现价 ${p} 已走完趋势目标 ${a.trendTarget}（途中必然越过波段目标 ${a.swingTarget??'--'}，所以先判趋势再判波段）`};
  if(hit(a.swingTarget)) return {k:'good', t:'波段目标到达 ✓',
    why:`现价 ${p} 已达波段目标 ${a.swingTarget}，距趋势目标 ${a.trendTarget??'--'} 还有空间`};
  return {k:'hold', t:'持有区间内',
    why:`现价 ${p} 夹在止损 ${a.shortStop}/${a.swingStop} 与目标 ${a.swingTarget??'--'} 之间——没破止损、也没到目标`};
}
/* 方向词盘中随价重算：bias 与 ma5 由后端收盘口径给出（固定），只有现价在动。
   空头排列里站上 MA5 当场变「止跌观望」，与「短线止损已破」同一时点成立，
   避免出现「顺势持空 + 短线止损已破」这种自相矛盾的组合。 */
/* 资金反向：日线结构没破（价格仍在 MA5 顺侧），但今天的钱在往反方向走。
   有它的时候方向词降级成「持X待验」——结构还没判输，但已经不是能加仓的顺势行情。 */
function fundAgainst(a, q){
  if(!a || !q) return null;
  const quad=q.quad, nr=Number(q.net_ratio||0);
  const up = quad==='long_attack' || quad==='short_cover';    // 价涨：多头进攻 / 空头回补
  const dn = quad==='short_attack' || quad==='long_exit';     // 价跌：空头进攻 / 多头离场
  if(a.bias==='bear' && up && nr>=15)
    return `今日价格上行、资金净流入 ${nr}%（${quad==='long_attack'?'增仓上涨·多头进攻':'减仓上涨·空头回补'}），与空单方向相反`;
  if(a.bias==='bull' && dn && nr<=-15)
    return `今日价格下行、资金净流出 ${Math.abs(nr)}%（${quad==='short_attack'?'增仓下跌·空头进攻':'减仓下跌·多头离场'}），与多单方向相反`;
  return null;
}
function advDir(a, price, q){
  if(!a) return '--';
  // 逆势档位（手上单子与盘面排列相反）：措辞必须是「逆势」，不能被说成「顺势」
  if(a.counter===true) return a.bias==='bull' ? '逆势持多' : '逆势持空';
  const m=a.ma5;
  if(a.bias==='bear'){
    if(m!=null && price>m) return '止跌观望';
    return fundAgainst(a,q) ? '持空待验' : '顺势持空';
  }
  if(a.bias==='bull'){
    if(m!=null && price<m) return '回调观望';
    return fundAgainst(a,q) ? '持多待验' : '顺势持多';
  }
  if(a.bias==='range') return '区间高抛低吸';
  return a.direction || '--';
}
function posBadge(advice, plan, price, dir, q){
  if(!price) return null;
  // ① 有持仓建议（收盘口径三档）：与下方持仓建议块同一判定，两处结论必然一致
  if(advice && advice.shortStop!=null && advice.swingStop!=null){
    const st=adviceState(advice, price);
    const cls={bad:'b-negDeep', warn:'b-neg', good:'b-pos', hold:'b-neu'}[st.k]||'b-neu';
    const how={
      bad :`怎么做：波段止损是趋势生命线，破了整笔离场，不补仓、不等回本；要再进等新信号（重新破位/重新站稳）`,
      warn:`怎么做：短线动能已证伪——先平短线仓/加仓部分，底仓可留到波段止损 ${advice.swingStop}；此位不追单`,
      good:`怎么做：目标已到，先减一半落袋，余仓改移动止损跟随；别在这里反手`,
      hold:`怎么做：拿着。短线破 ${advice.shortStop} 减一手，波段破 ${advice.swingStop} 全走，到 ${advice.swingTarget??'--'} 先减半`,
    }[st.k];
    return {text:st.t, cls,
      tip:`持仓建议｜${advDir(advice, price, q)}｜现价 ${Number(price).toFixed(0)}
`
        +`短线止损 ${advice.shortStop}｜波段止损 ${advice.swingStop}｜波段目标 ${advice.swingTarget??'--'}｜趋势目标 ${advice.trendTarget??'--'}
`
        +`判定依据：${st.why}
`
        +`优先级：波段止损破 ＞ 短线止损破 ＞ 趋势目标到 ＞ 波段目标到 ＞ 持有区间内
`
        +how+`
持有条件：${advice.holdCondition||'--'}
`
        +`口径：收盘后按日线 MA5/MA20/20日高低/ATR14 计算，盘中只把现价与各档比较`};
  }
  // ② 兜底：无 advice（老数据）时按开仓计划 plan 判
  if(!plan||plan.stop==null||plan.waveTarget==null||plan.trendTarget==null) return null;
  const stop=plan.stop, w=plan.waveTarget, t=plan.trendTarget;
  const isShort=dir==='short';
  const p=Number(price).toFixed(1).replace(/\.0$/,'');
  const dirTxt=isShort?'空单':'多单';
  const head=`${dirTxt}｜现价 ${p}｜止损 ${stop}｜波段目标 ${w}｜趋势目标 ${t}\n`;
  const ord='判定顺序：① 触止损（剧本失效）→ ② 到趋势目标 → ③ 到波段目标 → ④ 都没到 = 持有区间内';
  if(isShort? price>=stop : price<=stop)
    return {text:'短线止损已破 ⚠️', cls:'b-stop',
      tip:head+`判定依据：现价 ${p} 已${isShort?'上破':'跌破'}止损 ${stop}，剧本前提不成立\n`
        +ord+`\n怎么做：先离场，不补仓、不等回本；要再进必须等新信号（重新破位/重新站稳）`};
  if(isShort? price<=t : price>=t)
    return {text:'趋势目标到达 ✓', cls:'b-hold',
      tip:head+`判定依据：现价 ${p} 已走完趋势目标 ${t}（途中必然已越过波段目标 ${w}，所以先判趋势目标再判波段，否则会被误标成「波段目标到达」）\n`
        +ord+`\n怎么做：剩余仓位改移动止损跟随，别在这里反手`};
  if(isShort? price<=w : price>=w)
    return {text:'波段目标到达 ✓', cls:'b-hold',
      tip:head+`判定依据：现价 ${p} 已达波段目标 ${w}，但距趋势目标 ${t} 还差 ${Math.abs(t-p)} 点\n`
        +ord+`\n怎么做：先减一半落袋，余仓跟到 ${t}；跌破 ${w} 回头则把余仓也了结`};
  return {text:'持有区间内', cls:'b-hold',
    tip:head+`判定依据：现价 ${p} 夹在止损 ${stop} 与第一目标 ${w} 之间——没破止损、也没到任何目标，所以只能"持有"\n`
      +ord+`\n怎么做：${isShort?'上破':'跌破'} ${stop} 离场，${isShort?'跌到':'涨到'} ${w} 先减半，趋势目标 ${t} 再看`};
}
/* 信号标签悬停说明：标签 → 现状 → 判定规则 → 参数 → 下一步。
   标签只写四个字，凭什么给这个结论必须能当场查清（用户要求）。
   注意：streak 数的是「当前选中周期」的 K 线，切成 5 分钟/日线后「连续 3 根」含义随之变化，
   所以参数行把周期写出来，不写死 1 分钟。 */
const PERIOD_NAME={'60':'1 分钟','300':'5 分钟','86400':'日线'};
function periodName(){ return PERIOD_NAME[state.period]||state.period; }
function sigTip(sig, pb){
  if(!sig || !sig.rule) return '';
  const N=state.confirmBars||3;
  const np=((state.nearPct||0.01)*100).toFixed(1);
  const atr=pb?.atr;
  return `${sig.label}\n`
    +`现状：${sig.detail}\n`
    +`判定规则：${sig.rule}\n`
    +`参数：确认 = 连续 ${N} 根 ${periodName()}K线收盘｜接近阈值 ${np}%｜滞后降级 0.3×ATR`
      +(atr?`（ATR ${atr} ≈ ${Math.round(0.3*atr)} 点）`:'')+`\n`
    +`下一步：${sig.next||'—'}`;
}
/* 方向与信号全部自动计算 —— 不读 playbook.json 的 direction（人工设定已废弃）。
   方向 = 技术结构 + 持仓×价格四象限 + 当日资金失衡，每 tick 重算；
   信号 = 做多、做空两套独立判定，谁的条件满足就亮谁，不再只算剧本那一路。 */
/* dir-score:begin
   方向打分的**兜底**实现 —— 权威版本在后端 workbench/dirdir.py，随每条行情以
   quotes[sym].dir 下发，这里只在后端没给/旧数据时才用。
   两边公式与文案必须逐字一致，改这里必须同步改 dirdir.py；scripts/dir_parity.py 对拍。
   begin/end 标记别删：对拍脚本靠它把这段抽出来在 node 里跑。 */
const QUAD_SCORE={long_attack:2, short_cover:1, flat:0, long_exit:-1, short_attack:-2};
const DIR_QLABEL={long_attack:'多头进攻', short_cover:'空头回补', flat:'无量整理',
                  long_exit:'多头离场', short_attack:'空头进攻'};
function dirScore(rows, last, quad, netRatio, flowBars){
  const closes=(rows||[]).map(r=>r[4]).filter(v=>v!=null);
  const terms=[]; let s=0;
  const ma=n=>closes.length>=n?closes.slice(-n).reduce((a,b)=>a+b,0)/n:null;
  const m5=ma(5), m20=ma(20);
  if(m5!=null&&m20!=null){
    const d=m5>m20?1:-1; s+=d*1.5;
    terms.push(`MA5${d>0?'>':'<'}MA20（${m5.toFixed(0)}/${m20.toFixed(0)}）${d>0?'+':'−'}1.5`);
  } else terms.push('日线不足 20 根，MA 不计');
  if((rows||[]).length>=20){
    const w=rows.slice(-20);
    const hi=Math.max(...w.map(r=>r[2])), lo=Math.min(...w.map(r=>r[3]));
    if(hi>lo){
      const pos=(last-lo)/(hi-lo);                   // 0=20日区间底, 1=区间顶
      const d=pos>=0.6?1:pos<=0.4?-1:0;
      if(d){ s+=d*0.5; terms.push(`20日区间${d>0?'上':'下'}沿 ${(pos*100).toFixed(0)}% ${d>0?'+':'−'}0.5`); }
      else terms.push(`20日区间中部 ${(pos*100).toFixed(0)}% 0`);
    }
  }
  const qs=QUAD_SCORE[quad]??0;
  if(qs){ s+=qs; terms.push(`${DIR_QLABEL[quad]||DIR_QLABEL.flat} ${qs>0?'+':''}${qs}`); }
  const nr=netRatio||0;
  if(flowBars&&Math.abs(nr)>=5){
    const d=nr>0?1:-1; s+=d;
    terms.push(`资金失衡 ${nr>0?'+':''}${nr.toFixed(1)}% ${d>0?'+1':'−1'}`);
  } else if(flowBars){
    terms.push(`资金失衡 ${(nr>0?'+':'')+nr.toFixed(1)}%（|·|<5% 不计）`);
  }
  s=+s.toFixed(1);
  const level = s>=2? 'long' : s<=-2? 'short' : 'flat';
  const label = s>=4?'强多':s>=2?'偏多':s<=-4?'强空':s<=-2?'偏空':'中性';
  return {s, level, label, terms};
}
/* dir-score:end */

/* 颜色按打分符号连续过渡：≥2 红 / 0<s<2 淡红 / 0 黄 / -2<s<0 淡绿 / ≤-2 绿 */
function dirCls(s){
  return s>=2?'b-strongup':s<=-2?'b-strongdn':s>0?'b-mildup':s<0?'b-milddn':'b-neu';
}

function dynDir(sym){
  const q=state.quotes[sym];
  if(!q||!q.last) return null;
  let D=q.dir;                                  // 后端 dirdir.py 算好下发，优先用它
  if(!D||typeof D.s!=='number'){                // 兜底：后端没给（旧数据/离线页面）
    D=dirScore(state.klines?.[sym]?.['86400']||[], q.last, q.quad, q.net_ratio||0, q.flow_bars||0);
  }
  return {s:D.s, level:D.level, label:D.label, terms:D.terms, cls:dirCls(D.s)};
}

function dirTip(D){
  if(!D) return '等待日线数据';
  const lean = (D.s>0&&D.s<2) ? `\n颜色：打分 +${D.s} 没过 +2 阈值，结论仍是「中性」（不动手），但符号偏多，所以给淡红而不是纯黄`
             : (D.s<0&&D.s>-2) ? `\n颜色：打分 ${D.s} 没过 −2 阈值，结论仍是「中性」（不动手），但符号偏空，所以给淡绿而不是纯黄`
             : '';
  return `方向：${D.label}（打分 ${D.s>0?'+':''}${D.s}，实时自动重算）\n`
    +`算法：日线 MA5/MA20 排列 ±1.5 · 20 日区间位置（上/下沿 ±0.5）\n`
    +`　　　+ 四象限（相对昨结算的持仓×价格，±2/±1）· 资金失衡 ≥5% ±1\n`
    +`本行明细：${D.terms.join('；')}\n`
    +`阈值：≥4 强多 / ≥2 偏多 / −2~2 中性 / ≤−2 偏空 / ≤−4 强空\n`
    +`颜色：≥2 红 · 0~2 淡红（中性偏多） · 0 黄 · −2~0 淡绿（中性偏空） · ≤−2 绿`+lean;
}

/* 做多、做空两套信号并行计算：不只算剧本那一路，谁触发亮谁。 */
function dualSignal(sym){
  const pb=state.pbBySymbol?.[sym], q=state.quotes[sym];
  if(!pb||!q||!q.last) return {long:null, short:null};
  const closes=(state.klines[sym]?.[state.period]||[]).map(r=>r[4]);
  const a=atr14(sym);
  const N=state.confirmBars||3, np=state.nearPct||0.01;
  return {
    long:  scriptSignal(closes, q.last, pb.levels, np, N, 'long',  a),
    short: scriptSignal(closes, q.last, pb.levels, np, N, 'short', a),
  };
}

/* 当前可执行信号：方向由 dynDir 自动给出，中性时不出信号（两边都不做）。 */
function curSignal(sym){
  const D=dynDir(sym);
  if(!D || D.level==='flat') return null;
  const ds=dualSignal(sym);
  const sg = D.level==='long' ? ds.long : ds.short;
  return sg ? Object.assign({}, sg, {side:D.level}) : null;   // side 供 ticker 按「多红空绿」上色
}

     itemStyle:{color:'#FFFFFF',color0:'#2E7D32',borderColor:'#C93B3B',borderColor0:'#2E7D32'}},

    series.push({name:'MA20',type:'line',xAxisIndex:0,yAxisIndex:0,data:sma(closes,20),showSymbol:false,lineStyle:{width:1},itemStyle:{color:'#7F77DD'}});
  }
  if(showBOLL){
    series.push({name:'BOLL上',type:'line',xAxisIndex:0,yAxisIndex:0,data:bo.up,showSymbol:false,lineStyle:{width:1,type:'dashed'},itemStyle:{color:'#993556'}});
    series.push({name:'BOLL中',type:'line',xAxisIndex:0,yAxisIndex:0,data:bo.mid,showSymbol:false,lineStyle:{width:1},itemStyle:{color:'#5F5E5A'}});
    series.push({name:'BOLL下',type:'line',xAxisIndex:0,yAxisIndex:0,data:bo.lo,showSymbol:false,lineStyle:{width:1,type:'dashed'},itemStyle:{color:'#993556'}});
  }
  series.push({name:'MACD',type:'bar',xAxisIndex:2,yAxisIndex:2,barWidth:'60%',
               data:showMACD? mc.hist.map(v=>({value:v===null?null:+v.toFixed(2), itemStyle:{color:(v>=0)?'#C93B3B':'#2E7D32'}})) : []});
  if(showMACD){
    series.push({name:'DIF',type:'line',xAxisIndex:2,yAxisIndex:2,data:mc.dif.map(v=>v===null?null:+v.toFixed(2)),showSymbol:false,lineStyle:{width:1},itemStyle:{color:'#E6A23C'}});
    series.push({name:'DEA',type:'line',xAxisIndex:2,yAxisIndex:2,data:mc.dea.map(v=>v===null?null:+v.toFixed(2)),showSymbol:false,lineStyle:{width:1},itemStyle:{color:'#185FA5'}});
  }

  const ml=[];
  if(pb){

      if(typeof v==='number'){

                 label:{formatter:`${LEVEL_LABEL[key]||key} ${v}`,position:'insideEndTop',fontSize:9,color:'#8C8877'}});
      }
    }

  for(const l of (state.lines[sym]||[])){

      label:{formatter:(l.type==='support'?'支撑 ':l.type==='stop'?'止损 ':'压力 ')+l.price,
             position:'insideStartBottom',fontSize:10}});
  }
  series[0].markLine = ml.length? {silent:true,symbol:'none',data:ml} : {silent:true,symbol:'none',data:[]};

  return {
    animation:false,
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},confine:true,textStyle:{fontSize:11}},
    grid:[{left:46,right:10,top:16,height:'52%'},{left:46,right:10,top:'62%',height:'13%'},{left:46,right:10,top:'79%',height:'13%'}],

}
function renderChart(sym, force){
  const el=document.getElementById('c-'+sym);
  if(!el) return;
  const now=Date.now();
  if(!force && now-(state.lastDraw[sym]||0)<700) return;  // 每 0.7s 最多重绘一次
  state.lastDraw[sym]=now;
  let ch=state.charts[sym];
  if(!ch){ ch=echarts.init(el); state.charts[sym]=ch; }
  // 卡片搬进全屏弹层时容器尺寸会变，靠 ResizeObserver 跟着 resize，不然图表还是原尺寸留白
  if(!ch.__ro){
    ch.__ro=new ResizeObserver(()=>{ if(el.clientWidth) ch.resize(); });
    ch.__ro.observe(el);
  }
  const opt=chartOptionFor(sym);
  if(ch.__inited) delete opt.dataZoom; else ch.__inited=true;
  // 必须 replaceMerge series：默认合并模式下新 series 数组变短时旧线（MA/BOLL）不会被移除，
  // 表现为勾掉指标后图表纹丝不动。replaceMerge 按 id/顺序整组替换，勾选即时生效。
  ch.setOption(opt, {replaceMerge:['series'], lazyUpdate:false});
}

function checkPriceLines(sym,prev,cur){
  if(!prev||!cur||prev===cur) return;
  for(const l of (state.lines[sym]||[])){
    const crossed=(prev-l.price)*(cur-l.price)<=0 && Math.abs(cur-l.price)<50;
    if(crossed && Date.now()-(state.lastAlert[l.price+l.type]||0)>60000){
      state.lastAlert[l.price+l.type]=Date.now();
      const name=state.quotes[sym]?.name||sym;
      const dir=cur>prev?'上破':'下破';
      const kind=l.type==='stop'?`⚠️止损线${dir}`:(l.type==='support'?'⚠️支撑线触达':'⚠️压力线触达');
      showAlert(`${kind} | ${name} 现价 ${cur} 线 ${l.price}`);
    }
  }
}

const _ladCache = {};

  ['stopTarget',    '失守目标',  'tgt'],
];

/* 日内位：照参考台 InstrumentCard.IntradayRows 的四档算法
   压力 = max(今高, 昨结+0.5ATR)；一撑 = max(今低, 昨结-0.5ATR)；
   强撑 = 昨结-1ATR；失守 = 昨结-1.5ATR。
   一字板/停板会让四档撞值甚至倒挂，按 5% ATR 强制拉开，不让阶梯画反。 */
function dayLevels(q, atr){
  if(!q || !q.settle || !atr) return null;
  const half=atr*0.5, full=atr;
  const v=[
    Math.round(Math.max(q.high||0, q.settle+half)),
    Math.round(q.low ? Math.max(q.low, q.settle-half) : q.settle-half),
    Math.round(q.settle-full),
    Math.round(q.settle-full-half),
  ];
  const gap=Math.max(Math.round(atr*0.05),1);
  for(let i=1;i<v.length;i++) if(v[i]>=v[i-1]) v[i]=v[i-1]-gap;
  return v;
}

function ladderHtml(rows, last, nearPct, mini){
  if(!rows || rows.length<3) return '';
  // 最近档只在"还没被破"的档里挑：破掉的那条已不是支撑，脚下那条才是当前博弈位
  let nearIdx=-1, nd=Infinity;
  rows.forEach((r,i)=>{
    if(r.cls==='res' ? last>r.v : last<r.v) return;
    const d=Math.abs(r.v-last);
    if(d<nd){ nd=d; nearIdx=i; }
  });
  return rows.map((r,i)=>{
    const diff=(r.v/last-1)*100;                        // 正数=该位在现价上方
    const broken = r.cls==='res' ? last>r.v : last<r.v; // 压力被上破 / 支撑被跌破
    const near = i===nearIdx && !broken && Math.abs(diff)<=nearPct;
    const flag = broken ? (r.cls==='res'?'已上破':'已破') : (near?'最近':'');
    const cls=['lv',r.cls,mini?'mini':'',near?'near':'',broken?'broken':''].filter(Boolean).join(' ');
    const sign=diff>0?'+':'';
    const dStyle = Math.abs(diff)<=0.8 ? 'color:#854F0B;font-weight:600' : '';   // 贴近关键位=琥珀强调（不用红，红已表示看涨）
    // 标签悬停：状态含义 + 这一档的口径（日内位/波段位算法不同，混着看必错）
    const flagWhy = broken
      ? (r.cls==='res' ? '价格已站到该压力上方，这条位不再压价，反过来可当回踩支撑看' : '价格已跌到该支撑下方，支撑失效，反弹到这条位附近会变成压力')
      : (near ? `现价离这条位最近（${Math.abs(diff).toFixed(1)}%），当前多空就在这条线上博弈` : '');
    const tipTxt = `${r.label} ${r.v} ｜ 距现价 ${sign}${diff.toFixed(1)}%`
      + (flag?`\n状态：${flag}——${flagWhy}`:'')
      + `\n口径：${mini?'日内位 = 昨结算 ± ATR，盘中实时重算（管“今天在哪接/在哪压”）'
                      :'波段位 = 日线 20 日高低 + ATR，收盘后重算（管“这周在哪做”）'}`;
    return `<div class="${cls}" data-wbtip="${tipTxt}">
      <div class="k"><span>${r.label}</span></div>
      <div class="v">${r.v}<span class="d" style="${dStyle}">${sign}${diff.toFixed(1)}%</span></div>
      ${flag?`<span class="flag">${flag}</span>`:''}
    </div>`;
  }).join('');
}

function renderLadder(sym){
  const q=state.quotes[sym], pb=state.pbBySymbol?.[sym];
  if(!q || !q.last || !pb) return;
  const L=pb.levels||{}, last=q.last;

  // ① 波段位（日线 20 日口径）
  const box=document.getElementById('ladder-'+sym);
  if(box){
    const rows=LAD_ROWS.map(([k,label,cls])=>({v:L[k],label,cls})).filter(r=>r.v!=null);
    const html=ladderHtml(rows,last,1.5,false);
    if(_ladCache[sym]!==html){ _ladCache[sym]=html; box.innerHTML=html; }
  }
  // ② 日内位（昨结 ± ATR 口径）
  const dbox=document.getElementById('dladder-'+sym);
  if(dbox){
    const vals=dayLevels(q,pb.atr);
    const rows=vals?LAD_ROWS.map(([k,label,cls],i)=>({v:vals[i],label,cls})):[];
    const html=ladderHtml(rows,last,0.8,true);
    if(_ladCache['d'+sym]!==html){ _ladCache['d'+sym]=html; dbox.innerHTML=html; }
  }
  // ③ 标题注脚：标清基准，免得把昨结算的值当成 20 日位
  const cap=document.getElementById('lvcap-'+sym);
  if(cap) cap.textContent = pb.levelsAsOf? `截至 ${pb.levelsAsOf} 收盘` : '';
  const dcap=document.getElementById('dcap-'+sym);
  if(dcap) dcap.textContent = q.settle
    ? `昨结 ${q.settle} · 今高 ${q.high||'--'}/今低 ${q.low||'--'} · ATR ${pb.atr||'--'}`
    : '待开盘';
}

/* ---------- 基差面板 ----------
   基差 = 现货 − 期货（本项目所有品种都是这个方向，单位先归一到期货报价单位再相减）。
   术语按盘面说：基差 > 0 = 现货高于期货 = 现货升水 / 盘面贴水。
   深浅不用百分比判、用 ATR 倍数判——五个品种基差量级差一个数量级（鸡蛋 14.6%、豆粕 1.9%），
   百分比横向没法比，换算成「几个 ATR」才有统一的"深不深"尺度。
   历史分位来自 archive.db（每天收盘附近一条基差），不足 3 天不显示，避免拿 1 个样本瞎说。 */
const _basisCache = {};
function basisTier(sp){
  const p = Math.abs(sp.basisPct || 0);
  const am = sp.basisAtr == null ? null : Math.abs(sp.basisAtr);
  // 有 ATR 用倍数（跨品种可比）；没有就退回百分比粗分
  if (am != null) return am < 0.3 ? 0 : am < 1 ? 1 : am < 2 ? 2 : 3;
  return p < 1 ? 0 : p < 4 ? 1 : p < 10 ? 2 : 3;
}
function renderBasis(sym){
  const box = document.getElementById('basisbox-' + sym);
  if (!box) return;
  const pb = state.pbBySymbol?.[sym], q = state.quotes[sym], sp = q && q.spot;
  if (!pb) return;
  if (!sp){
    if (_basisCache[sym] === 'none') return;
    _basisCache[sym] = 'none';
    box.innerHTML = `<div class="bbhd"><span>基差 · 现货 − 期货</span><span class="bgrade flat">未接通</span></div>`
      + `<div class="bbnote">现货源抓取失败或首次加载中，稍后自动重试。</div>`
      + (pb.basisNote ? `<div class="bbmemo">口径备注：${escHtml(pb.basisNote)}</div>` : '');
    return;
  }
  const b = sp.basis, pct = sp.basisPct, h = sp.hist, m = sp.basisAtr;
  const tier = basisTier(sp);
  const side = b > 0 ? '贴水' : '升水';           // 盘面视角
  const label = tier === 0 ? '平水 · 无保护' : ['', '小幅', '明显', '深'][tier] + side;
  const sg = v => (v > 0 ? '+' : '');
  const upDown = b > 0 ? 'up' : b < 0 ? 'dn' : '';

  // 一句话讲清「这个贴水深不深、该防哪边」
  let why;
  if (tier === 0) why = '现货与盘面基本平水，期现回归给不了方向，价格主要看产业面与资金。';
  else if (b > 0) why = `现货比盘面高 ${pct}%${m != null ? `（≈${Math.abs(m).toFixed(1)}×ATR）` : ''}——盘面贴水，下方有现货买盘与交割成本托底，做空要防回归，做多有安全垫。`;
  else why = `现货比盘面低 ${Math.abs(pct)}%${m != null ? `（≈${Math.abs(m).toFixed(1)}×ATR）` : ''}——盘面升水，上方有套保与交割压力，做多要防回归，做空有安全垫。`;
  if (h){
    if (h.pct >= 80) why += b > 0 ? `贴水处在近 ${h.n} 日 ${h.pct}% 高位，现货偏强，回归方向偏多。` : `升水处在近 ${h.n} 日 ${h.pct}% 高位，现货偏弱，上方压制偏重。`;
    else if (h.pct <= 20) why += b > 0 ? `贴水已收窄到近 ${h.n} 日低位，现货支撑在减弱。` : `升水已收窄到近 ${h.n} 日低位，上方压制在减轻。`;
    else why += `处于近 ${h.n} 日 ${h.pct}% 分位，不算极端。`;
  }

  // 历史基差迷你柱：高度按区间归一，正负分色（贴水红 / 升水绿，与行情行一致）
  let spark = '';
  if (h && h.series && h.series.length > 2){
    const vals = h.series.map(x => x[1]);
    const lo = Math.min(...vals, 0), hi = Math.max(...vals, 0), rng = (hi - lo) || 1;
    spark = `<div class="bbspark">` + h.series.map(([d, v]) => {
      const hgt = Math.max(8, Math.round((Math.abs(v) / rng) * 100));
      return `<i style="height:${hgt}%;background:${v >= 0 ? '#C98A8A' : '#8FBF9A'}" data-wbtip="${d} 基差 ${sg(v)}${v}"></i>`;
    }).join('') + `</div>`;
  }

  const histCell = h
    ? `<div class="bc"><div class="k">${h.n} 日分位</div><div class="v">${h.pct}%</div>`
      + `<div class="d">${sg(h.lo)}${h.lo} ~ ${sg(h.hi)}${h.hi}</div></div>`
    : `<div class="bc"><div class="k">历史分位</div><div class="v">--</div><div class="d">积累中 1/3 天</div></div>`;
  const chgTxt = h ? `${h.chg > 0 ? '+' : ''}${h.chg} 较昨` : '';

  const html = `<div class="bbhd"><span>基差 · 现货 − 期货</span>`
    + `<span class="bgrade ${tier === 0 ? 'flat' : (b > 0 ? 'up' : 'dn')}">${label}${m != null && tier > 0 ? ` ${Math.abs(m).toFixed(1)}×ATR` : ''}</span></div>`
    + `<div class="bbgrid">`
    + `<div class="bc"><div class="k">现货 · ${escHtml(sp.src || '生意社')}</div>`
    + `<div class="v">${Math.round(sp.spot * 100) / 100}<span style="font-size:9px;color:#88867F;font-weight:400"> ${escHtml(sp.unit)}</span></div>`
    + `<div class="d">${escHtml(String(sp.asof || '').slice(5))} · 基差按折盘面算</div></div>`
    + `<div class="bc"><div class="k">期货 ${escHtml(String(pb.mainSymbol || sym).replace(/^[A-Za-z]+\./, ''))}</div>`
    + `<div class="v">${sp.fut != null ? sp.fut : '--'}</div>`
    + `<div class="d">${sp.closed ? '收盘价口径' : '主连最新'}</div></div>`
    + `<div class="bc"><div class="k">基差</div>`
    + `<div class="v ${upDown}">${sg(b)}${b}</div>`
    + `<div class="d">${sg(pct)}${pct}%${chgTxt ? ' · ' + chgTxt : ''}</div></div>`
    + histCell
    + `</div>`
    + `<div class="bbnote">${why}</div>`
    + spark
    + (pb.basisNote ? `<div class="bbmemo">口径备注（人工维护）：${escHtml(pb.basisNote)}</div>` : '')
    + (sp.stale || sp.closed ? `<div class="bbmemo">${sp.closed ? '当前期货价取日线收盘（盘中无报价），基差按收盘口径算。' : ''}${sp.stale ? '现货数据滞后，基差仅供参考。' : ''}</div>` : '');

  if (_basisCache[sym] === html) return;
  _basisCache[sym] = html;
  box.innerHTML = html;
}

/* ---------- 持仓建议 ----------
   算法照参考项目 position_advice()：三档并行，按自己的持仓周期选用
     短线止损 = 短线动能证伪线（MA5 顺侧 / 现价∓1.5ATR）
     波段止损 = 趋势生命线（MA20；震荡市用 20日低 - 1ATR）
     波段目标 / 趋势目标 = 20日高低 ± 1/2 ATR（震荡市只给区间上沿）
   数据是收盘口径（levels.py 15:10 重算），这里只做「现价 vs 各档」的实时标注：
     状态优先级 波段止损破 > 短线止损破 > 趋势目标到 > 波段目标到 > 持有区间内。
   为什么不看 direction 字符串判多空：区间震荡的止损在目标下方，用价位结构推会翻成多头，
   所以方向直接由文案判定（含「空头」即空）。 */
const _advCache = {};
/* 建议方向（空/多）不看文案，看价位结构 —— 与参考台 adviceBearish 同口径。
   为什么不能用文案：direction 已经从「空头趋势」升级成「止跌观望 / 顺势持空」这类策略词，
   里面根本没有"空头"两个字，再靠字符串匹配会一律判成多头、止损方向全反。
   结构判据：目标位（波段或趋势）与波段止损谁高谁低——空头目标在下、止损在上。
   目标缺失时退化用 shortStop 比：空头止损档必然更高。 */
function adviceBearish(a){
  // 后端下发 bias 时直接用，最稳：参考台今早把 advice 的 swingStop/swingTarget 一起标成
  // null（"空单已离场"的表达），结构判据退化后空头被误判成多头，3277 对 3320 的
  // 空单离场线（本该在上方）被判成"跌破下方止损"，页面上就凭空冒出"短线止损已破"。
  if (a.bias === 'bear') return true;
  if (a.bias === 'bull') return false;
  const t = a.swingTarget ?? a.trendTarget;
  if (t != null && a.swingStop != null && a.swingStop !== t) return a.swingStop > t;
  if (a.swingStop != null && a.shortStop != null) return a.swingStop > a.shortStop;
  return false;
}
/* ---------- 我的仓位（每品种独立，存 localStorage）----------
   'short' / 'long' / 'flat' / 不设。
   不设 = 按盘面 bias 给顺势建议（默认行为，和以前一致）；
   设成和 bias 相反时，换成 advice.counter 那套「逆势档位」——止损放反方向、目标看回均线。
   为什么要这个：以前的建议只按趋势给，手上拿反向单的人看到「顺势持空」并不知道自己该怎么办。 */
function mySide(sym){
  try{ return (JSON.parse(localStorage.getItem('fris.pos')||'{}')||{})[sym] || ''; }
  catch(e){ return ''; }
}
function setMySide(sym, v){
  let m={};
  try{ m=JSON.parse(localStorage.getItem('fris.pos')||'{}')||{}; }catch(e){}
  if(v) m[sym]=v; else delete m[sym];
  localStorage.setItem('fris.pos', JSON.stringify(m));
  _advCache[sym]=''; renderChrome(sym);
}
/* 把「我的仓位 + 盘面 bias」合成为实际用于渲染的那套档位 */
function effAdvice(sym, a){
  const side=mySide(sym);
  if(!a) return {a:null, side, counter:false};
  const c=a.counter;
  if(side==='long' && a.bias==='bear' && c)
    return {a:{bias:'bull', counter:true, ma5:c.ma5, shortStop:c.shortStop, swingStop:c.swingStop,
               swingTarget:c.swingTarget, trendTarget:c.trendTarget, holdCondition:c.holdCondition}, side, counter:true};
  if(side==='short' && a.bias==='bull' && c)
    return {a:{bias:'bear', counter:true, ma5:c.ma5, shortStop:c.shortStop, swingStop:c.swingStop,
               swingTarget:c.swingTarget, trendTarget:c.trendTarget, holdCondition:c.holdCondition}, side, counter:true};
  return {a, side, counter:false};
}
function sideSwitch(sym){
  const cur=mySide(sym);
  // 「顺趋势」= 不声明仓位（老行为）：按盘面 bias 给顺势档位，
  // 这时方向词里的「持空/持多」指的是顺趋势那一边，不是你实际的单子。
  const opt=[['short','空单','空单 · 我手上的仓位\n止损在上方、目标在下方，按空头方向给档位\n盘面是多头排列时自动换「逆势持空」那套'],
             ['long','多单','多单 · 我手上的仓位\n止损在下方、目标在上方，按多头方向给档位\n盘面是空头排列时自动换「逆势持多」那套'],
             ['flat','空仓','空仓 · 我还没有仓位\n不再给持仓建议，改显机位（开仓参考 / 止损 / 双目标）\n等信号触发再按机位下单'],
             ['','顺趋势','顺趋势 · 不声明我的仓位\n按盘面趋势给建议：方向词里的「持空 / 持多」指的是顺趋势那一边，不代表我实际拿的单子\n这是老行为，也是默认值；拿不准就留在这个，不影响其他判定']];
  return `<span class="possw">${opt.map(([v,l,t])=>
    `<b class="${cur===v?'on':''}" data-pos="${v}" data-sym="${sym}" data-wbtip="${t}">${l}</b>`).join('')}</span>`;
}
function renderAdvice(sym){
  const box=document.getElementById('adv-'+sym);
  if(!box) return;
  const pb=state.pbBySymbol?.[sym], q=state.quotes[sym];
  const raw=pb&&pb.advice, price=q&&q.last;
  const {a, side, counter}=effAdvice(sym, raw);
  if(!raw || !price){ if(box.innerHTML) box.innerHTML=''; return; }
  // 空仓：不给持仓建议，直接给机位（进场计划）
  if(side==='flat'){
    const pl=pb.plan||{};
    const cell0=(label,v,kind)=>{const dcls=v==null?'':(v>price?'u':'d');
      return `<div class="ac ${kind} ${dcls}"><div class="k">${label}</div><div class="v">${v==null?'--':v}</div><div class="d">${v==null?'震荡不给':'进场计划'}</div></div>`;};
    const html0=`<div class="ahd"><span>持仓建议 · 空仓</span><span style="flex:1"></span>${sideSwitch(sym)}</div>
      <div class="agrid">${cell0('开仓参考',pl.entry,'stop')}${cell0('止损',pl.stop,'stop')}${cell0('波段目标',pl.waveTarget,'tgt')}${cell0('趋势目标',pl.trendTarget,'tgt')}</div>
      <div class="sub" style="margin-top:3px;font-size:9.5px;color:#A8A69E">空仓不适用持仓建议，以上是进场计划；等信号触发再按机位下单</div>`;
    if(_advCache[sym]===html0) return;
    _advCache[sym]=html0; box.innerHTML=html0; bindPosSwitch(box); return;
  }
  const bear=adviceBearish(a), rng=(a.bias==='range')||/区间/.test(a.direction||'');
  const dirTxt=advDir(a, price, q);    // 方向词随实时价切换，与徽章同一时点
  const st=adviceState(a, price);   // 与头部徽章同一判定
  const fAgainst=fundAgainst(a, q); // 资金反向说明（有值时方向词为「持X待验」）

  const cell=(label, v, kind)=>{
    if(v==null) return `<div class="ac ${kind}"><div class="k">${label}</div><div class="v">--</div><div class="d">震荡不给</div></div>`;
    const dp=(v-price)/price*100;
    const dcls = v>price ? 'u' : 'd';     // 价位在现价上方=红，下方=绿
    const crossed = kind==='stop' ? (bear ? price>=v : price<=v) : (bear ? price<=v : price>=v);
    const near = !crossed && Math.abs(dp)<0.5;
    const cls = crossed ? (kind==='stop'?'brk':'hit') : near?'near':'';
    return `<div class="ac ${kind} ${cls} ${dcls}">
      <div class="k">${label}</div><div class="v">${v}</div>
      <div class="d">${dp>0?'+':''}${dp.toFixed(1)}%${crossed?(kind==='stop'?' 已破':' 到达'):near?' 逼近':''}</div></div>`;
  };
  const tip=[`持仓建议 · ${dirTxt}`,
    ...(counter? [`逆势持仓：你手上是${a.bias==='bull'?'多单':'空单'}，与盘面${a.bias==='bull'?'空头':'多头'}排列相反——这套档位是给逆势单用的，止损放反方向、目标看回均线，不是趋势目标。`] : []),
    ...(fAgainst? [`为什么是「待验」：${fAgainst}。结构没破不等于能加仓——只减不加，守 ${a.shortStop}。`,
      a.bias==='bear'
        ? `但它不是转多：现价仍在 MA5(${a.ma5??a.shortStop}) 下方，资金只是「进了」，还没被价格确认；做多要等站上 ${a.shortStop} 并站稳再说。`
        : `但它不是转空：现价仍在 MA5(${a.ma5??a.shortStop}) 上方，资金只是「跑了」，还没被价格确认；做空要等跌破 ${a.shortStop} 再说。`] : []),
    `短线止损 ${a.shortStop}：短线动能证伪线，破了下手（或平掉加仓部分）`,
    `波段止损 ${a.swingStop}：趋势生命线，破了整笔离场`,
    `波段目标 ${a.swingTarget??'--'} / 趋势目标 ${a.trendTarget??'--'}：分批止盈参考`,
    ``,
    `持有条件：${a.holdCondition||'--'}`,

    `与「机位」区分——机位是还没进场时的开仓计划，这里管已有仓位怎么拿。`].join('\n');

  const html=`<div class="ahd" data-wbtip="${tip.replace(/"/g,'')}">

  if(_advCache[sym]===html) return;
  _advCache[sym]=html; box.innerHTML=html; bindPosSwitch(box);

function bindPosSwitch(root){

function renderFlow(sym){
  const q=state.quotes[sym], box=document.getElementById('flow-'+sym);
  if(!q||!box) return;  const qd=QUAD[q.quad]||QUAD.flat;
  const fl=q.flow_long||0, fs=q.flow_short||0, tot=fl+fs;
  const lp=tot>0? fl/tot*100 : 50;
  const net=q.flow_net||0;
  const netCls=net>0?'up':net<0?'dn':'';
  const oiCls=q.oi_chg>0?'up':q.oi_chg<0?'dn':'';
  const prCls=q.chg>0?'up':q.chg<0?'dn':'';
  const noData=!q.flow_bars;
  // 口径必须写在脸上：这是「当日累计」，不是滚动窗口。不写清楚会被当成近半小时的资金。
  const scope=noData
    ? '<span style="color:#B8860B">资金流数据缺失（K线未就绪）</span>'
    : `当日累计 ${(q.flow_start||'').slice(6)}→${(q.datetime||'').slice(11,16)||'--'} · ${q.flow_bars} 根`
      +(q.flow_trunc?' · <span style="color:#B8860B">K线窗口不足，开盘段可能缺</span>':'');
  // 噪声分级：成交额/持仓市值越大 = 日内投机盘越重，K线级估算越不可信
  const act=q.oi_value? (q.flow_amt||0)/q.oi_value : 0;
  const noise=act>=1.2?'高频换手·估算失真大':act>=0.5?'换手偏高·谨慎看':'低换手·参考性较好';
  const nr=q.net_ratio||0;
  const turn=q.open_interest? (q.volume||0)/q.open_interest*100 : 0;
  // 两块分开写，和参考台一致：上面是「真金白银」的持仓×价格四象限（可信），
  // 下面是分钟K线的成交额估算（噪声大）。挤成一块会让人把估算当成真实资金。
  //
  // 「多空力量」直接用参考台 FundFlow.tsx 的口径，保证两边数字能对上：
  //   ① 四象限给基准占比 D（多头进攻 100 / 空头进攻 0 / 空头回补 35 / 多头离场 65 / 无量 50）
  //   ② 按持仓变化率强度从 50% 向 D 收敛：long = 50 + (D-50)*(0.5+0.5*min(|ΔOI%|/3,1))
  //   ③ 新增头寸 = ΔOI × 价 × 乘数，再按占比拆成多/空两侧金额
  // 它与下面「分钟实测手数」是两套东西：一个是四象限的定性结论量化后的分布，
  // 一个是逐分钟 ΔOI 归属统计出来的实测值，减仓日会明显背离，两个都留着以便互相印证。
  const actL=q.oi_long||0, actS=q.oi_short||0, actT=actL+actS;
  const noAct=!q.oi_bars || actT<=0;
  const ap=noAct? 50 : actL/actT*100;
  const actTip=OI_TIP+`\n\n今日多方 ${fmtWan(actL,2)} 万手 · 空方 ${fmtWan(actS,2)} 万手`
    +`（累计 ${q.oi_bars||0} 根分钟K线）`;
  const ratioLong=(q.oi_ratio_ref==null? Math.round(ap) : q.oi_ratio_ref);
  const ratioShort=100-ratioLong;
  const oiAmt=q.oi_amt||0, absAmt=Math.abs(oiAmt);
  const longAmt=absAmt*ratioLong/100, shortAmt=absAmt*ratioShort/100;
  const netAmt=Math.max(longAmt,shortAmt);
  const netIsLong=ratioLong>=50;
  const strengthPct=Math.min(Math.abs(q.oi_pct||0)/3*100,100);
  const POWER_TIP=`多空力量\n`
    +`占比不是逐笔数出来的，是四象限基准按强度收敛得到的：\n`
    +`　多头进攻基准 100%｜空头进攻 0%｜空头回补 35%｜多头离场 65%｜无量整理 50%\n`
    +`　long = 50 + (基准−50) × (0.5 + 0.5 × min(|持仓变化率| ÷ 3, 1))\n`
    +`当前：${qd.label}，基准 ${({long_attack:100,short_attack:0,short_cover:35,long_exit:65})[q.quad]??50}%`
    +`，|ΔOI%| ${Math.abs(q.oi_pct||0).toFixed(2)}% → 强度 ${strengthPct.toFixed(0)}% → 多 ${ratioLong}% / 空 ${ratioShort}%\n`
    +`新增头寸 = ΔOI ${q.oi_chg>0?'+':''}${q.oi_chg} 手 × 现价 ${q.last} × 乘数（元/点）÷ 1e8 = ${oiAmt>0?'+':''}${oiAmt.toFixed(2)} 亿\n`
    +`多/空金额 = |新增头寸| 按占比拆分：${longAmt.toFixed(2)} / ${shortAmt.toFixed(2)} 亿\n`
    +`注：金额乘数按「元/点」折算；塑料/聚丙烯/豆粕/玉米的合约单位与「元/点」相同，\n`
    +`鸡蛋不同（合约 5 吨 vs 1 点 10 元），其金额按合约单位算会再翻一倍，看鸡蛋金额时留意。\n`
    +`下面「实测手数」是另一套：逐分钟 ΔOI 按涨跌归到动作方，减仓日与这里会背离。`;
  const powerBar=`<div class="barrow" data-wbtip="${POWER_TIP}">
       <span class="barlbl">多空力量</span>
       <div class="flowbar">
         <i style="width:${ratioLong}%;background:#C93B3B">多 ${ratioLong}%</i>
         <i style="width:${ratioShort}%;background:#2E7D32">空 ${ratioShort}%</i>
       </div>
     </div>`;
  const fdA=_fdOpen.has(sym+':a'), fdB=_fdOpen.has(sym+':b');
  const _fh=
    `<div class="sec">
       <div class="ttl">真实资金动向（持仓×价格）<span class="v"><span class="badge ${qd.cls}" data-wbtip="${QUAD_TIP}">${qd.label} · ${qd.grade}</span></span><button type="button" class="fdbtn" data-fd="${sym}:a">${fdA?'收起':'明细'}</button></div>
       <div class="cells">
         <div class="cell"><span class="k">持仓变化</span>
           <b class="${oiCls}">${q.oi_chg>0?'+':''}${fmtChg(q.oi_chg)}</b>
           <span class="k">(${q.oi_pct>0?'+':''}${q.oi_pct}%)</span></div>
         <div class="cell"><span class="k">价格</span>
           <b class="${prCls}">${q.chg>0?'+':''}${q.chg}</b>
           <span class="k">(${q.pct>0?'+':''}${q.pct}%)</span></div>
       </div>
       ${powerBar}
       <div class="fdet"${fdA?'':' style="display:none"'}>
       <div class="sub" data-wbtip="${POWER_TIP}"><b class="${netIsLong?'up':'dn'}">${netIsLong?'多头':'空头'}净流入 ${netAmt.toFixed(1)} 亿</b>
         · 多 ${longAmt.toFixed(1)} / 空 ${shortAmt.toFixed(1)} 亿
         · 新增头寸 ${oiAmt>0?'+':''}${oiAmt.toFixed(1)} 亿</div>
       <div class="sub" data-wbtip="${actTip}">实测手数：多 ${ap.toFixed(0)}% / 空 ${(100-ap).toFixed(0)}%（${q.oi_bars||0} 根，${noAct?'数据缺失':'另一口径'}）</div>
       <div class="sub">${qd.note}</div>
       </div>
     </div>
     <div class="sec">
       <div class="ttl" data-wbtip="${FLOW_TIP}">资金流向估算<span class="sm">${noData?'':'（分钟级）'} · 噪声大·仅供参考</span>
         <span class="v ${netCls}" data-wbtip="${FLOW_TIP}">${noData?'数据缺失':(net>=0?'多头净流入 ':'空头净流入 ')+Math.abs(net).toFixed(2)+'亿'}</span><button type="button" class="fdbtn" data-fd="${sym}:b">${fdB?'收起':'明细'}</button></div>
       <div class="flowbar" data-wbtip="${FLOW_TIP}">
         <i style="width:${lp.toFixed(1)}%;background:#C93B3B">多 ${lp.toFixed(0)}%</i>
         <i style="width:${(100-lp).toFixed(1)}%;background:#2E7D32">空 ${(100-lp).toFixed(0)}%</i>
       </div>
       <div class="fdet"${fdB?'':' style="display:none"'}>
       <div class="sub">持仓 ${fmtWan(q.open_interest,1)} 万手 · 市值 ${q.oi_value} 亿 · 换手 ${turn.toFixed(0)}%
         ｜ ${scope}${noData?'':` · 成交额 ${q.flow_amt} 亿 · 失衡 ${nr>0?'+':''}${nr}% · ${noise}`}</div>
       </div>
     </div>`;
  // 整块重绘会把悬停中的标签节点一起换掉（浮层跟着闪）。内容没变就不动 DOM。
  if(_flowCache[sym]===_fh) return;
  _flowCache[sym]=_fh; box.innerHTML=_fh;
}
