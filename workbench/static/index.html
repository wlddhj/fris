/* ---------- 卡片全屏 ----------
   把真实卡片 DOM 搬进弹层，而不是复制一份：所有 id、图表实例、渲染函数都不用改，
   行情继续往里刷。原位放一块等高虚线占位，其余卡片不会重排。关闭即搬回。 */
let maxSym=null;
function maximize(sym){
  if(maxSym===sym){ restoreMax(); return; }     // 再点一次同一个按钮 = 还原
  if(maxSym) restoreMax();
  const panel=document.getElementById('p-'+sym);
  if(!panel||!panel.parentNode) return;
  const h=panel.offsetHeight;
  const ph=document.createElement('div');
  ph.className='panel-ph'; ph.id='ph-'+sym;
  ph.style.height=h+'px';
  ph.innerHTML='<span>已全屏显示</span><span style="font-size:11px">点击这里还原</span>';
  panel.parentNode.insertBefore(ph, panel);
  document.getElementById('maxslot').appendChild(panel);
  panel.classList.add('maximized');
  const q=state.quotes[sym]||{};
  document.getElementById('maxttl').textContent=`${q.name||''} ${q.symbol||sym}`;
  const wrap=document.getElementById('maxwrap');
  wrap.classList.add('on'); wrap.setAttribute('aria-hidden','false');
  document.body.classList.add('maxing');
  maxSym=sym;
  setTimeout(()=>state.charts[sym]?.resize(),80);
}
function restoreMax(){
  if(!maxSym) return;
  const sym=maxSym; maxSym=null;
  const panel=document.getElementById('p-'+sym), ph=document.getElementById('ph-'+sym);
  if(panel){
    panel.classList.remove('maximized');
    if(ph&&ph.parentNode) ph.parentNode.replaceChild(panel, ph);
    else document.getElementById('grid').appendChild(panel);
  }
  if(ph&&!ph.parentNode) ph.remove();
  const wrap=document.getElementById('maxwrap');
  wrap.classList.remove('on'); wrap.setAttribute('aria-hidden','true');
  document.body.classList.remove('maxing');
  setTimeout(()=>state.charts[sym]?.resize(),80);
}
document.addEventListener('click', e=>{
  const btn=e.target.closest?.('.maxbtn');
  if(btn){ maximize(btn.dataset.max); return; }
  if(e.target.closest?.('.panel-ph')){ restoreMax(); return; }
  if(e.target.id==='maxclose' || e.target.id==='maxwrap' || e.target.id==='maxslot') restoreMax();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && maxSym) restoreMax(); });

/* 中储粮玉米竞价：收储与抛储的量级结构，只有玉米卡片显示。
   数据 = 中储粮网「交易公告」(计划量) + 「交易结果」(成交率)，20 分钟一轮。
   为什么要一起看净轮入和进口拍卖：只盯采购量会把抛储当成收储，方向正好相反。 */
const _sinoCache={};
const _thesisCache={};   // 主线/基差/季节性/技术口径整段 HTML，内容不变就不重写
function renderSino(sym, pb){
  const box=document.getElementById('sino-'+sym);
  if(!box) return;
  if(!pb || pb.id!=='C'){ if(box.innerHTML) box.innerHTML=''; if(box.style.display!=='none') box.style.display='none'; return; }
  if(box.style.display==='none') box.style.display='';
  const s=state.sino;
  if(!s || !s.ok){
    const msg='<span style="color:#B8860B">中储粮：未接通（首轮全量抓取约 40 秒）</span>';
    if(_sinoCache[sym]!==msg){ _sinoCache[sym]=msg; box.innerHTML=msg; }
    return;
  }
  const t=s.today||{};
  const wan=v=>(v==null?'--':(v/1e4).toFixed(1));
  const net=t.netInT, ncol=net==null?'#666':(net>0?'#A32D2D':net<0?'#2E7D32':'#666');
  const cov=t.coverageBuyPct, rate=t.rateBuyPct;
  const rows=[];
  rows.push(`<div class="row"><span class="k">采购</span> 今日计划 <b>${wan(t.planBuyT)}</b> 万吨/${t.buySessions||0} 场`
    +(t.doneBuyT!=null?` · 已成交 <b>${wan(t.doneBuyT)}</b> 万吨`:'')
    +(rate!=null?` · 成交率 <b>${rate}%</b>${(cov!=null&&cov<100)?`<span class="k">（覆盖 ${cov}%）</span>`:''}`:'')
    +`</div>`);
  rows.push(`<div class="row"><span class="k">净轮入</span> <b style="color:${ncol}">${net==null?'--':(net>0?'+':'')+wan(net)}</b> 万吨`
    +(t.importSellT?` · <span class="k">进口玉米定向拍卖</span> <b>${wan(t.importSellT)}</b> 万吨（抛储）`:'')
    +(t.planSellT?` · <span class="k">销售计划</span> <b>${wan(t.planSellT)}</b> 万吨`:'')
    +`</div>`);
  const fwd=(s.forward||[]).filter(f=>f.planBuyT).map(f=>`${f.day.slice(5)} <b>${wan(f.planBuyT)}</b>`).join(' · ');
  if(fwd) rows.push(`<div class="row"><span class="k">后续排期</span> ${fwd}</div>`);
  const html=`<div class="hd">中储粮 · 玉米竞价<span class="tm">${(s.fetchedAt||'').slice(5,16)}${s.stale?' · 数据滞后':''}</span></div>`+rows.join('');
  if(_sinoCache[sym]===html) return;
  _sinoCache[sym]=html;
  box.innerHTML=html;
}
/* 隆众产业数据：塑料（PE）与聚丙烯（PP）两张卡才显示。
   数据来自 longzhong.py 抓的隆众资讯原文（登录墙后），30 分钟一轮：
     PE ← 产能利用率周数据（周四发）+ 重点生产企业聚烯烃库存日数据（工作日 9:30 前）
     PP ← 生产企业库存周数据（周三发）+ 下游分项开工率（周五发）
   这四项正好是产业信号里 l1/l2/pp1/pp2 自动判定的输入，放在卡片上是为了
   「信号为什么亮/为什么不亮」能当场对账，不用再翻隆众后台。 */
const _lzCache={};
function renderLz(sym, pb){
  const box=document.getElementById('lz-'+sym);
  if(!box) return;
  const mine = pb && (pb.id==='L' ? ['pe_cap','twooil'] : pb.id==='PP' ? ['pp_stock','pp_down'] : null);
  if(!mine){ if(box.innerHTML) box.innerHTML=''; if(box.style.display!=='none') box.style.display='none'; return; }
  if(box.style.display==='none') box.style.display='';
  const d=state.lz;
  const put=html=>{ if(_lzCache[sym]===html) return; _lzCache[sym]=html; box.innerHTML=html; };
  if(!d || !Object.keys(d).length){
    put('<div class="hd">隆众 · 产业数据<span class="tm">抓取中</span></div>'
      +'<div class="row"><span class="k">首轮抓取约 20 秒（4 个栏目顺序取）</span></div>');
    return;
  }
  if(!d.configured){
    put('<div class="hd">隆众 · 产业数据<span class="tm">未接通</span></div>'
      +'<div class="row bad">未配置账号 Cookie（config.json → longzhong.cookie），'
      +'在 workbench 目录跑 <b>node lz_login.js</b> 登录一次即可</div>');
    return;
  }
  // 20261020 → 10-20；隆众 URL 里是 YYMMDD
  const dstr=k=>k&&k.length===6?`${k.slice(2,4)}-${k.slice(4,6)}`:(k||'--');
  const sg=v=>(v>0?'+':'')+(v==null?'':v);
  const col=v=>v==null?'#666':(v>0?'#2E7D32':'#A32D2D');   // 库存增=累库利空=绿、降=去库利多=红
  const rows=[];
  const itm=col=>((d.items||{})[col])||{};
  const bad=(col,label)=>{
    const it=itm(col);
    const why = it.reason==='login' ? 'Cookie 已过期，重跑 lz_login.js'
              : it.reason==='noperm' ? '账号未开通该数据资讯（订阅到期）'
              : (it.err || '尚未抓到数据（首轮约 20 秒）');
    rows.push(`<div class="row"><span class="k">${label}</span> <span class="bad">${escHtml(why)}</span></div>`);
  };

  if(pb.id==='L'){
    const pe=itm('pe_cap');
    if(pe.ok){
      const p=pe.parsed||{}, v=p.value, dl=p.delta;
      rows.push(`<div class="row"><span class="k">PE产能利用率</span> <b>${v==null?'--':v.toFixed(2)}%</b>`
        +(dl!=null?` · 较上期 <b style="color:${col(-dl)}">${sg(dl)}pp</b>`:'')
        +` <span class="k">· 周数据 ${dstr(pe.date)}</span></div>`);
    } else bad('pe_cap','PE产能利用率');
    const tw=itm('twooil');
    if(tw.ok){
      const p=tw.parsed||{}, v=p.value, dl=p.delta;
      rows.push(`<div class="row"><span class="k">两油库存</span> <b>${v==null?'--':v.toFixed(1)}</b> 万吨`
        +(dl!=null?` · 环比 <b style="color:${col(dl)}">${sg(dl)}</b>（上期 ${p.prev==null?'--':p.prev.toFixed(1)}）`:'')
        +(p.lastYear!=null?` <span class="k">· 去年同期 ${p.lastYear.toFixed(1)}</span>`:'')
        +` <span class="k">· 日数据 ${dstr(tw.date)}</span></div>`);
    } else bad('twooil','两油库存');
  } else {
    const ps=itm('pp_stock');
    if(ps.ok){
      const p=ps.parsed||{}, v=p.value, dl=p.delta;
      rows.push(`<div class="row"><span class="k">生产企业库存</span> <b>${v==null?'--':v.toFixed(2)}</b> 万吨`
        +(dl!=null?` · 环比 <b style="color:${col(dl)}">${sg(dl)}</b>（上期 ${p.prev==null?'--':p.prev.toFixed(2)}）`:'')
        +` <span class="k">· 周数据 ${dstr(ps.date)}</span></div>`);
    } else bad('pp_stock','生产企业库存');
    const pd=itm('pp_down');
    if(pd.ok){
      const p=pd.parsed||{}, avg=p.value, dl=p.delta;
      const seg=['塑编','注塑','BOPP'].filter(k=>p[k]!=null)
        .map(k=>`${k} <b>${p[k].toFixed(2)}%</b>`).join(' / ');
      rows.push(`<div class="row"><span class="k">下游开工</span> 平均 <b>${avg==null?'--':avg.toFixed(2)}%</b>`
        +(dl!=null?`（较上周 <b style="color:${col(-dl)}">${sg(dl)}pp</b>）`:'')
        +` <span class="k">· 周数据 ${dstr(pd.date)}</span></div>`);
      if(seg) rows.push(`<div class="row"><span class="k">分项</span> ${seg}</div>`);
    } else bad('pp_down','下游开工');
  }
  const st=d.status==='ok'?'':(d.status==='noPermission'?'权限未开通':d.status==='needLogin'?'需重新登录':'部分栏目缺失');
  put(`<div class="hd">隆众 · 产业数据${st?` <span class="bad">${st}</span>`:''}`
     +`<span class="tm">${(d.at||'').slice(5,16)} 抓取</span></div>`+rows.join(''));
}
/* 卓创产业数据：只有鸡蛋（JD）卡显示。

const _zcCache={};
function renderZc(sym, pb){
  const box=document.getElementById('zc-'+sym);
  if(!box) return;
  if(!pb || (pb.id!=='JD' && pb.id!=='C')){ if(box.innerHTML) box.innerHTML=''; if(box.style.display!=='none') box.style.display='none'; return; }
  if(box.style.display==='none') box.style.display='';

      +'<div class="row"><span class="k">首轮抓取约 15 秒</span></div>');
    return;
  }
  /* 玉米卡：卓创基层售粮进度（东北/华北，两区平均过 50% 算卖压释放过半）。
     卓创随收购季更新，新季首期一般 11 月发布；未发布时如实显示，不做估算替身。 */
  if(pb.id==='C'){
    const it=((d.items||{})['corn_sell'])||{};
    const rows=[];
    if(it.ok){
      const p=it.parsed||{};
      const avg = p.avg!=null ? p.avg : p.value;
      const pp = v => v==null ? '' : ' '+(v>0?'+':'')+v.toFixed(0)+'pp';
      const seg=[];
      if(p.ne!=null)  seg.push('东北 '+p.ne.toFixed(0)+'%<span class="k">'+pp(p.neYoy)+'</span>');
      if(p.hua!=null) seg.push('华北 '+p.hua.toFixed(0)+'%<span class="k">'+pp(p.huaYoy)+'</span>');
      if(seg.length) rows.push('<div class="row"><span class="k">分地区</span> '+seg.join(' · ')+'</div>');
      const over = avg!=null && avg>50;
      rows.push('<div class="row"><span class="k">'+(p.avg!=null?'两区平均':'进度')+'</span> '
        +'<b style="color:'+(over?'#A32D2D':'#666')+'">'+(avg==null?'--':avg.toFixed(1)+'%')+'</b>'
        +(p.lastYear!=null?' <span class="k">· 去年同期 '+p.lastYear.toFixed(0)+'%</span>':'')
        +(p.season?' <span class="k">· '+p.season+' 年度</span>':'')+'</div>');
      rows.push('<div class="row"><span class="k">'
        +(over?'已过 50%，基层卖压释放过半'
              :(avg==null?'阈值 50%':'距 50% 还差 '+(50-avg).toFixed(1)+'pp'))
        +'</span><span class="tm">'+(it.date||'').slice(0,10)+'</span></div>');
    } else {
      rows.push('<div class="row"><span class="k">进度</span> <span class="bad">'
        +escHtml(it.err || '尚未抓到数据')+'</span></div>');
    }
    put('<div class="hd">卓创 · 售粮进度<span class="tm">'+(d.at||'').slice(5,16)+' 抓取</span></div>'
      +rows.join(''));
    return;
  }
  const rows=[];
  /* 鸡蛋主产区均价：jd1「现货止跌」的判定输入。卓创日报每交易日 15:30 发，
     产品页同时挂着最近 4 期，所以序列是现成的，不用等攒天数。
     判定按定义逐日比：最近 3 个观测日各自不能低于它的前低。 */
  const egg=((d.items||{})['egg_price'])||{};
  if(egg.ok){
    const ss=(egg.series||[]).filter(x=>x.price!=null);
    const px=ss.map(x=>x.price);
    let brk=-1, brkLow=null;
    for(let i=Math.max(1,px.length-3); i<px.length; i++){
      const lo=Math.min.apply(null, px.slice(0,i));
      if(px[i]<lo){ brk=i; brkLow=lo; }
    }
    const p=egg.parsed||{};
    rows.push('<div class="row"><span class="k">主产区均价</span> '
      +ss.slice(-4).map(x=>'<span class="k">'+((x.date||'').slice(5))+'</span> <b>'+x.price.toFixed(2)+'</b>').join(' → ')
      +' 元/斤</div>');
    rows.push('<div class="row"><span class="k">当日</span> 较上一日 '
      +'<b style="color:'+(p.delta>0?'#A32D2D':p.delta<0?'#2E7D32':'#666')+'">'
      +(p.delta>0?'涨':p.delta<0?'跌':'平')+'</b>'
      +(p.xiaoqu!=null?' · 销区 '+p.xiaoqu.toFixed(2)+' 元/斤':'')
      +(p.cullPrice!=null?' · 淘鸡 '+p.cullPrice.toFixed(2)+' 元/斤':'')+'</div>');
    rows.push('<div class="row"><span class="k">止跌判定</span> '
      +(brk<0? '<b style="color:#A32D2D">连续 3 日未创新低</b>'
             : '<b style="color:#666">仍在创新低</b>（'+((ss[brk]||{}).date||'').slice(5)
               +' 破前低 '+(brkLow==null?'--':brkLow.toFixed(2))+'）')
      +'<span class="tm">'+((egg.date||'').slice(0,10))+'</span></div>');
  } else {
    rows.push('<div class="row"><span class="k">主产区均价</span> <span class="bad">'
      +escHtml(egg.err || '尚未抓到数据（日报每交易日 15:30 发布）')+'</span></div>');
  }
  const col=v=>v==null?'#666':(v>0?'#2E7D32':'#A32D2D');   // 出栏增=供应增、利空蛋价=绿；降=利多=红
  const sg=v=>(v>0?'+':'')+(v==null?'':v);
  const it=((d.items||{})['taoji'])||{};
  if(it.ok){
    const p=it.parsed||{}, v=p.value, dl=p.deltaPct;
    rows.push(`<div class="row"><span class="k">出栏量</span> <b>${v==null?'--':v.toFixed(2)}</b> 万只`
      +(dl!=null?` · 环比 <b style="color:${col(dl)}">${sg(dl)}%</b>`:'')
      +(p.prev!=null?`（上期 ${p.prev.toFixed(2)}）`:'')
      +(p.yoy!=null?` <span class="k">· 同比 ${sg(p.yoy)}%</span>`:'')
      +` <span class="k">· 周数据 ${(it.date||'').replace(/^(\d{4})-(\d{2})-W(\d)$/,'$1年$2月第$3周')}</span></div>`);
  } else {
    const why = it.reason==='login' ? 'Cookie 已过期，重跑 zc_login.js'
              : it.reason==='noperm' ? '卓创畜牧业主订阅到期（试用 10-27 止）'
              : (it.err || '尚未抓到数据（首轮约 15 秒）');
    rows.push(`<div class="row"><span class="k">出栏量</span> <span class="bad">${escHtml(why)}</span></div>`);
  }
  const st=d.status==='ok'?'':(d.status==='noPermission'?'权限未开通':d.status==='needLogin'?'需重新登录':'部分栏目缺失');
  put(`<div class="hd">卓创 · 鸡蛋${st?` <span class="bad">${st}</span>`:''}`
     +`<span class="tm">${(d.at||'').slice(5,16)} 抓取</span></div>`+rows.join(''));
}

/* 季节性一行：当前月 + 后两月的历史月均涨跌与上涨年份占比。
   数字全部来自 seasonality.json（seasonality.py 按同合约月末环比起算）。
   手写经验文案已彻底移除——它与 7 年样本对不上（鸡蛋写「11月压力最大」，
   实际 11 月 -1.51% 只排第 4 弱，最弱是 8 月 -4.38%），且用户要求不留。
   没有可用样本时返回空串，这一行整体不显示。 */
/* 技术口径胶囊条：把 server 给的 techNote 长串（"收盘 3302 · MA5 3394 MA20 3658 · ATR14 87 · …"）
   拆成「名称 + 数值」胶囊。拆法：先按「·」切段，段内按已知指标名单配对（MA5/MA20 同段也能拆开）。
   趋势一项带红绿：向上红 / 向下绿，其余数值统一深色，扫一眼能分清方向。 */
function techChips(pb, esc){
  if(!pb.techNote) return '';
  const NAMES=/^(MA\d+|ATR\d+|收盘|趋势|历史分位|量比|换手|持仓)$/;
  const pairs=[];
  pb.techNote.split('·').forEach(seg=>{
    let cur=null;
    seg.trim().split(/\s+/).forEach(t=>{
      if(NAMES.test(t)){ cur={k:t,v:''}; pairs.push(cur); }
      else if(cur) cur.v += (cur.v?' ':'')+t;
    });
  });
  if(!pairs.length) return '';
  const chips=pairs.map(p=>{
    let cls='';
    if(p.k==='趋势') cls = /多头|向上|上行/.test(p.v) ? ' up' : /空头|向下|下行/.test(p.v) ? ' dn' : '';
    return `<span class="tc${cls}">${esc(p.k)} <b>${esc(p.v)}</b></span>`;
  }).join('');
  const asof=pb.levelsAsOf?`<span class="tnote">关键位截至 ${esc(pb.levelsAsOf)} 收盘</span>`:'';
  const tip='技术口径（日线级别，盘中不重算）\n'
    +'收盘：最近交易日收盘价\nMA5 / MA20：5 日 / 20 日简单均线\n'
    +'ATR14：14 日平均真实波幅，日内关键位与 0.3×ATR 降级都由它推算\n'
    +'趋势：按均线排列判定（价 < MA5 < MA20 = 空头趋势，反之多头，缠绕=震荡）\n'
    +'历史分位：当前收盘价在近 5 年日线收盘中的百分位\n'
    +(pb.levelsAsOf?`关键位：支撑/压力/止损按 ${pb.levelsAsOf} 收盘计算，次日开盘前更新`:'');
  return `<span class="tech" data-wbtip="${esc(tip)}">${chips}${asof}</span>`;
}

function seasonInline(pb, esc){
  const sa=pb.seasonalAuto;  if(!sa || !(sa.months||[]).length) return '';
  const usable=(sa.months||[]).filter(x=>x.avg!=null);
  if(!usable.length) return '';
  const f2=v=>v.toFixed(2);
  const segs=usable.map(x=>`${x.m}月 ${x.avg>0?'+':''}${f2(x.avg)}%（胜${x.win}%）`);
  const span=sa.nMin===sa.nMax? `${sa.nMin} 年` : `${sa.nMin}–${sa.nMax} 年`;
  const tip=[`近 ${sa.range} 年样本（每月 ${span}有效）`]
    .concat(usable.map(x=>
      `${x.m}月 均值 ${x.avg>0?'+':''}${f2(x.avg)}% ｜ 胜率 ${x.win}% ｜ 样本 ${x.n} 年 ｜ `
      +`最好 ${x.best>0?'+':''}${f2(x.best)}% / 最差 ${x.worst>0?'+':''}${f2(x.worst)}%`))
    .concat(['', '算法：取该品种各主力交割月合约的月末收盘，同合约算环比（不跨换月跳空），按月分组统计。'])
    .filter(Boolean).join('\n');
  return `<span class="seas" data-wbtip="${esc(tip)}">${esc(segs.join(' · '))}</span>`;
}

  renderLz(sym, pb);
  renderZc(sym, pb);
  renderMs(sym, pb);

  // 现货与基差：现货价 - 主连最新价。基差为正=现货升水（盘面贴水），红；负=绿。
  // 鸡蛋的现货价优先取卓创主产区均价（server 端已选源），其余品种走生意社。
  const spEl=document.getElementById('spot-'+sym);
  if(spEl){
    const sp=q.spot;
    if(!sp){
      spEl.innerHTML='<span style="color:#B8860B">现货：未接通（抓取失败或首次加载中）</span>';
    }else{
      const bc=sp.basis>0?'#A32D2D':sp.basis<0?'#2E7D32':'#666';
      const sg=v=>v>0?'+':'';
      // 现货按原始报价展示（鸡蛋元/斤、其余元/吨），不做单位换算，方便核对原始数据源。
      // 基差仍是「现货折盘面 − 期货」的口径，数值不受展示影响。
      const sv=Math.round(sp.spot*100)/100;
      spEl.innerHTML=`现货 <b>${sv}</b> ${sp.unit}`
        +` · <span data-wbtip="基差＝现货折盘面 − 期货，单位是期货报价单位（鸡蛋为元/500千克），所以和左侧原始报价单位不同；括号里是与盘面的百分比。">基差 <b style="color:${bc}">`
        +`${sg(sp.basis)}${sp.basis}</b></span>（${sg(sp.basisPct)}${sp.basisPct}%）`
        +` · ${sp.src||'生意社'} ${sp.asof.slice(5)}`
        +`${sp.closed?' <span style="color:#B8860B">· 收盘口径</span>':''}`
        +`${sp.stale?' <span style="color:#B8860B">· 数据滞后</span>':''}`;
    }
  }

  // 方向：完全由盘面算（MA5/MA20 + 20日区间 + 四象限 + 资金失衡），不读人工 direction
  const D=dynDir(sym);
  const dirEl=document.getElementById('dir-'+sym);
  if(dirEl){
    if(!D){ dirEl.style.display='none'; }
    else {
      dirEl.style.display='';
      dirEl.textContent=`方向：${D.label} ${D.s>0?'+':''}${D.s}`;
      dirEl.className='badge '+D.cls;
      dirEl.dataset.wbtip=dirTip(D);
    }
  }

  // 做多、做空两套信号并列：各自独立判定，谁条件满足亮谁
  const DS=dualSignal(sym);
  const paintSig=(id, sg, side)=>{
    const el=document.getElementById(id);
    if(!el) return;
    if(!sg){ el.style.display='none'; return; }
    el.style.display='';
    const arrow=side==='long'?'↑多':'↓空';
    const body=String(sg.label||'').replace(/^[🔴🟡⚪✓\s]+/,'');
    // 观望时补「距关键位还差多少」：否则满屏「观望」看不出离触发有多远
    let gapTxt='';
    if(sg.state==='watch' && q.last){
      const lv=pb?.levels||{};
      const key=side==='long'?lv.longTriggerBreak:lv.shortBreakdown;
      if(key){ const gp=(key-q.last)/q.last*100; gapTxt=` ${gp>0?'距+':'已过'}${Math.abs(gp).toFixed(1)}%`; }
    }
    el.textContent=`${arrow} ${body}${gapTxt}`;
    const firedCls = side==='long' ? 'b-fired' : 'b-firedS';
    el.className='badge '+({fired:firedCls,confirming:'b-confirm',near:'b-near',watch:'b-watch'}[sg.state]||'b-watch');
    el.dataset.wbtip=sigTip(sg,pb);
  };
  paintSig('sigL-'+sym, DS.long,  'long');
  paintSig('sigS-'+sym, DS.short, 'short');

  const sig=curSignal(sym);
  // 触发/确认时整卡描边强调，扫一眼就能定位到出信号的品种
  const panel=document.getElementById('p-'+sym);
  if(panel) panel.className='panel'+(sig?.state==='fired'?' alarm':sig?.state==='confirming'?' armed':'');

  renderLadder(sym);
  renderAdvice(sym);
  const det=document.getElementById('detail-'+sym);
  if(det) det.textContent=sig&&sig.detail?('信号：'+sig.detail):'';

  const th=document.getElementById('thesis-'+sym);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if(th && pb){
    const seas=seasonInline(pb,esc);
    const html=`<div class="bb" id="basisbox-${sym}"></div>`
      +`主线：${esc(pb.thesis)}`
      +(seas?`<br>季节性：${seas}`:'')
      +techChips(pb,esc);
    // 这块内容全是静态的（主线/基差/季节性/技术口径），却原来每 tick 重写一次。
    // 除了白费，重写还会把悬停浮层接管过的 .tech / .seas 节点换掉，导致节点的 title
    // 复活、原生悬浮窗跟着弹出来。内容没变就不动 DOM。
    if(_thesisCache[sym]!==html){ _thesisCache[sym]=html; th.innerHTML=html; }
  }

  renderBasis(sym);

  renderFlow(sym);

  const pbd=pb?posBadge(effAdvice(sym,pb.advice).a,pb.plan,q.last,D?.level||'flat',q):null;
  const posEl=document.getElementById('pos-'+sym);
  if(posEl){
    if(pbd){
      posEl.style.display=''; posEl.textContent=pbd.text; posEl.className='badge '+pbd.cls;
      posEl.dataset.wbtip=pbd.tip||'';
    } else posEl.style.display='none';
  }
  const chips=document.getElementById('chips-'+sym);
  if(chips){
    const lines=state.lines[sym]||[];
    chips.innerHTML=lines.length?lines.map((l,i)=>
      `<span class="chip ${l.type}" data-sym="${sym}" data-i="${i}" data-wbtip="点击删除">${l.type==='support'?'支撑':l.type==='resist'?'压力':'止损'} ${l.price} ✕</span>`).join('')
      :'<span style="color:#BBB">未设价位线</span>';
    chips.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
      (state.lines[sym]||[]).splice(+el.dataset.i,1);
      localStorage.setItem('plines',JSON.stringify(state.lines));
      renderChrome(sym); renderChart(sym,true);
    });
  }
}

function renderIndustry(sym){
  const pb=state.pbBySymbol?.[sym], box=document.getElementById('i-'+sym);
  if(!pb||!box) return;
  const hits=state.indHit[sym]||{};
  const auto=(state.auto||{})[pb.id]||{};
  const sigs=pb.industrySignals||[];
  const isHit=x=>!!hits[x.id] || auto[x.id]?.state==='hit';
  const cnt=sigs.filter(isHit).length;
  const autoN=sigs.filter(x=>auto[x.id]).length;
  const manualN=sigs.length-autoN;
  box.innerHTML=
    `<div class="indhd">
       <span>产业信号 <span class="n">自动 ${autoN} · 人工 ${manualN}</span></span>
       <span class="cnt" style="color:${cnt?'#6E6A5F':'#A8A69E'}">${cnt}/${sigs.length} 已触发</span>
     </div>`
    + sigs.map(x=>{
        const hit=!!hits[x.id], arm=state.indArm===sym+x.id;
        const a=auto[x.id];
        const tip=escHtml((x.desc||'')+(x.triggerCondition?'｜'+x.triggerCondition:''));
        if(a){   // 自动判定：无按钮，只报状态 + 判定依据
          const st=a.state, on=st==='hit';
          const tag=on?'✓ 自动触发':st==='unknown'?'? 数据不足':st==='ref'?'参考值':'○ 未触发';
          // 触发时按信号自身的利多/利空上色：+1 红、-1 绿、0 保持中性紫灰
          const dirCls=on?(a.bias>0?'dirup':a.bias<0?'dirdn':''):'';
          const cls=(on?'hit':(st==='unknown'||st==='ref')?'arm':'')+(dirCls?' '+dirCls:'');
          const src2=String(x.dataSource||'').replace(/（自动）$/,'');
          return `<div class="sigrow ${cls}" data-wbtip="${tip}">
            <span class="st"></span><b>${x.name}</b>
            <span class="cond">${x.triggerCondition}</span>
            <span class="atag ${st} ${dirCls}">${tag}</span>
          </div>`
          + (a.detail? `<div class="adetail ${cls}" data-wbtip="${escHtml(a.detail)}"><span class="dsrc">${escHtml(src2)}</span><span>${escHtml(a.detail)}</span></div>`:'');
        }
        return `<div class="sigrow ${hit?'hit':''}" data-wbtip="${tip}">
          <span class="st"></span><b>${x.name}</b>
          <span class="cond">${x.triggerCondition}</span>
          <span class="src">${x.dataSource}</span>
          <button data-sym="${sym}" data-id="${x.id}" class="${arm?'arm':''}">${hit?'✓ 已确认':arm?'再点确认':'标记'}</button>
        </div>`;
      }).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const s=b.dataset.sym, id=b.dataset.id;
    state.indHit[s]=state.indHit[s]||{};
    if(state.indArm===s+id){
      state.indHit[s][id]=!state.indHit[s][id];
      state.indArm=null;
      localStorage.setItem('fm_industry_v1',JSON.stringify(state.indHit));
      if(state.indHit[s][id]) showAlert(`产业信号已确认：${state.quotes[s]?.name||s} ${id}`);
    } else state.indArm=s+id;
    renderIndustry(s);
  });
}

/* ---------- 季节性日历 ---------- */
function renderSeason(){
  const box=document.getElementById('season-body');
  if(!box) return;
  const data=state.season;
  if(!data||!data.products||!data.products.length){
    box.innerHTML='<div class="sub">季节性数据未生成。在 workbench 目录执行 <code>python seasonality.py</code>（需 TQ_AUTH_USER / TQ_AUTH_PASS）后再刷新。</div>';
    return;
  }
  const curM=new Date().getMonth()+1;
  // 统一色阶：以所有单元格 |均值| 的 85 分位为满格，避免个别极端值压掉其它月份
  const abs=data.products.flatMap(p=>p.months.filter(x=>x.n).map(x=>Math.abs(x.avg))).sort((a,b)=>a-b);
  const cap=Math.max(1.2, abs[Math.floor(abs.length*0.85)]||2);
  const color=v=>{
    const a=Math.min(1, Math.abs(v)/cap);
    const rgb=v>=0?'201,59,59':'46,125,50';
    return `rgba(${rgb},${(0.08+a*0.55).toFixed(2)})`;
  };
  const ns=data.products.flatMap(p=>p.months.filter(x=>x.n).map(x=>x.n));
  const nMin=Math.min(...ns), nMax=Math.max(...ns);

  let h='<table class="seasontbl"><thead><tr><th></th>'
    + Array.from({length:12},(_,i)=>`<th class="${i+1===curM?'cur':''}">${i+1}月</th>`).join('')
    + '<th>最强 / 最弱</th></tr></thead><tbody>';

  data.products.forEach(p=>{
    const withN=p.months.filter(x=>x.n);
    const mx=withN.slice().sort((a,b)=>b.avg-a.avg)[0]||{m:'-',avg:0};
    const mn=withN.slice().sort((a,b)=>a.avg-b.avg)[0]||{m:'-',avg:0};
    h+=`<tr><td class="nm"><b>${p.name}</b> <span class="sub">${p.id}</span></td>`;
    p.months.forEach(x=>{
      if(!x.n){ h+='<td><div class="cell na"><div class="v">--</div><div class="s">无样本</div></div></td>'; return; }
      const tip=`${p.name} · ${x.m} 月\n均值 ${x.avg>0?'+':''}${x.avg}% ｜ 中位 ${x.med>0?'+':''}${x.med}%\n胜率 ${x.win}%（样本 ${x.n} 年）\n最好 ${x.best>0?'+':''}${x.best}% / 最差 ${x.worst>0?'+':''}${x.worst}%\n`
        + x.years.map(e=>`${e.y} ${e.r>0?'+':''}${e.r}%  ${e.c.split('.')[1]}`).join('\n');
      h+=`<td data-wbtip="${tip.replace(/"/g,'')}"><div class="cell" style="background:${color(x.avg)}">`
        + `<div class="v">${x.avg>0?'+':''}${x.avg}</div><div class="s">${x.win}% · ${x.n}年</div></div></td>`;
    });
    h+=`<td class="sum">↑ ${mx.m}月 ${mx.avg>0?'+':''}${mx.avg}%<br>↓ ${mn.m}月 ${mn.avg>0?'+':''}${mn.avg}%</td></tr>`;
  });
  h+='</tbody></table>';
  h+=`<div class="sub" style="margin-top:6px">${data.method}｜样本 ${data.products[0]?.range||''}，每月 ${nMin}–${nMax} 年 · 生成于 ${data.generated_at}｜数字为月均涨跌 %，下方为上涨年份占比</div>`;
  box.innerHTML=h;
}

/* ================= 底部四面板：简报 / 价差 / 纪律仓位 / 消息面 ================= */
const NIGHT_SESSION = {JD:false, L:true, PP:true, M:true, C:true};   // 鸡蛋无夜盘
const SENT_BEAR = /利空|看空|下跌|破位|走弱|压力|累库|丰产|回落|减仓|走软/;
const SENT_BULL = /利多|利好|看多|上涨|企稳|支撑|去化|止跌|增仓/;
function sentCls(t){
  if(SENT_BEAR.test(t) && !/利多|利好/.test(t)) return 'dn';
  if(SENT_BULL.test(t) && !SENT_BEAR.test(t)) return 'up';
  return '';
}
function fmtN(v,d){ return (v==null||isNaN(v))?'--':Number(v).toFixed(d); }
/* 量/仓统一"万手"口径：只返回数字，单位由调用方拼，避免各处写法不一 */
function fmtWan(v,d){ return (v==null||isNaN(v))?'--':(Number(v)/1e4).toFixed(d==null?1:d); }
/* 持仓变化是增量、量级小：万手级才转万，小额保留"手"，否则 -0.02 万手读不出强弱 */
function fmtChg(v){
  if(v==null||isNaN(v)) return '--';
  const n=Number(v);
  return Math.abs(n)>=1e4 ? `${(n/1e4).toFixed(2)} 万手` : `${n.toFixed(0)} 手`;
}
function escHtml(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 自动产业信号: 首次转为"触发"才响一次, 回落后再触发可再次提醒; silent 用于 init 建基线不吵 */
function syncAuto(next, silent){
  state.auto=next||{};
  for(const pid in state.auto){
    const row=state.auto[pid]||{};
    for(const sid in row){
      const st=row[sid].state, k=pid+':'+sid;
      if(st==='hit'){
        if(!state.autoSeen[k]){
          state.autoSeen[k]=1;
          if(!silent){
            const sym=Object.keys(state.pbBySymbol).find(s=>state.pbBySymbol[s].id===pid);
            const nm=state.quotes[sym]?.name||pid;
            showAlert(`⚙️ 产业信号自动触发｜${nm} · ${(row[sid].detail||'').split('｜').pop().slice(0,46)}`);
          }
        }
      } else delete state.autoSeen[k];
    }
  }
}
function seasonCell(pid,m){
  const p=(state.season?.products||[]).find(x=>x.id===pid);
  return p? (p.months||[]).find(x=>x.m===m)||null : null;
}
function atr14(sym){
  const k=state.klines[sym]?.['86400']||[];
  if(k.length<16) return null;
  const bars=k.slice(0,-1); // 去掉今日未完成
  const tail=bars.slice(-15);
  let sum=0,n=0;
  for(let i=1;i<tail.length;i++){
    const h=tail[i][2], l=tail[i][3], pc=tail[i-1][4];
    sum+=Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc)); n++;
  }
  return n? sum/n : null;
}

/* ---------- 简报 ---------- */
function genBrief(kind){
  const mNow=new Date().getMonth()+1;
  const groups=[];
  state.order.forEach(sym=>{
    const q=state.quotes[sym]||{}, pb=state.pbBySymbol?.[sym]||{}, lv=pb.levels||{}, pl=pb.plan||{};
    if(!q.last) { groups.push({head:`${q.name||sym} ${sym.split('.')[1]||''}`, lines:['暂无成交数据（休市或未开盘）']}); return; }
    const sig=curSignal(sym);
    const lines=[];
    const d2=lv.longTriggerBreak?((q.last-lv.longTriggerBreak)/q.last*100):null;
    const d3=lv.shortBreakdown?((q.last-lv.shortBreakdown)/q.last*100):null;
    const seas=seasonCell(pb.id,mNow);
    const indHit=(state.indHit[pb.id]||{});
    const indAuto=((state.auto||{})[pb.id]||{});
    const indN=(pb.industrySignals||[]).filter(x=>indHit[x.id]||indAuto[x.id]?.state==='hit').length;
    const indAutoN=(pb.industrySignals||[]).filter(x=>indAuto[x.id]?.state==='hit').length;

    if(kind==='premarket'){
      lines.push(`昨结 ${fmtN(q.settle,0)}，昨收 ${fmtN(q.last-q.chg,0)}；现价 ${fmtN(q.last,0)}（${q.pct>0?'+':''}${fmtN(q.pct,2)}%）`);
      if(lv.longTriggerBreak||lv.shortBreakdown){
        const t1 = lv.longTriggerBreak ? (q.last>=lv.longTriggerBreak
            ? `已上破多突破位 ${lv.longTriggerBreak}（+${fmtN((q.last-lv.longTriggerBreak)/lv.longTriggerBreak*100,1)}%）`
            : `距多突破位 ${lv.longTriggerBreak} 还有 ${fmtN(Math.abs(d2),1)}%`) : '';
        const t2 = lv.shortBreakdown ? (q.last<=lv.shortBreakdown
            ? `已跌破空破位 ${lv.shortBreakdown}（-${fmtN((lv.shortBreakdown-q.last)/lv.shortBreakdown*100,1)}%）`
            : `距空破位 ${lv.shortBreakdown} 还有 ${fmtN(Math.abs(d3),1)}%`) : '';
        lines.push(`关键位：${[t1,t2].filter(Boolean).join('；')}`);
      }
      if(seas) lines.push(`季节性：${mNow} 月历史均值 ${seas.avg>0?'+':''}${seas.avg}%（胜率 ${seas.win}%，${seas.n} 年）`);
      const _D=dynDir(sym);
      lines.push(`产业信号：${indN}/${(pb.industrySignals||[]).length} 已触发（其中自动 ${indAutoN}）· 方向 ${_D?_D.label+' '+( _D.s>0?'+':'')+_D.s:'--'}`);
    }
    if(kind==='intraday'){
      lines.push(`信号：${sig?sig.label:'--'}${sig&&sig.detail?'（'+sig.detail+'）':''}`);
      const quadTxt={long_attack:'多头进攻·强多',short_cover:'空头回补·弱多',short_attack:'空头进攻·强空',long_exit:'多头离场·弱空',flat:'无量整理·观望'}[q.quad]||'--';
      lines.push(`资金：${quadTxt} · 持仓 ${q.oi_chg>0?'+':''}${fmtChg(q.oi_chg)}（${q.oi_pct>0?'+':''}${fmtN(q.oi_pct,2)}%）`);
      lines.push(`当日净流入（多−空） ${q.flow_net>0?'+':''}${fmtN(q.flow_net,2)} 亿（${q.flow_net>=0?'多头':'空头'}净流入｜失衡 ${fmtN(q.net_ratio,1)}%，多侧 ${fmtN(q.flow_long,2)} / 空侧 ${fmtN(q.flow_short,2)} 亿，自 ${(q.flow_start||'').slice(6)} 累计 ${q.flow_bars||0} 根）`);
      lines.push(`成交 ${fmtWan(q.volume,1)} 万手 · 持仓 ${fmtWan(q.open_interest,1)} 万手`);
    }
    if(kind==='close'){
      const k1=state.klines[sym]?.['86400']||[];

      if(bar.length>=6){
        const amp=(bar[2]-bar[3])/bar[1]*100;

      }

      lines.push(`收盘位于 ${lv.firstSupport??'--'}~${lv.resistance??'--'} 区间，${pl.stop?`止损参考 ${pl.stop}`:''}`);
    }
    if(kind==='night'){
      if(!NIGHT_SESSION[pb.id]){
        lines.push('无夜盘（15:00 收盘）——隔夜风险主要是次日跳空');
      }else{
        lines.push(`夜盘 21:00–23:00 · 现价 ${fmtN(q.last,0)}`);
        lines.push(`夜盘关注：上破 ${lv.longTriggerBreak??'--'} 转强 / 下破 ${lv.shortBreakdown??'--'} 转弱`);
        lines.push(`日内收在 ${q.pct>0?'红盘':'绿盘'}（${fmtN(q.pct,2)}%），持仓 ${q.oi_chg>0?'增':'减'} ${fmtChg(Math.abs(q.oi_chg))}`);
      }
    }
    groups.push({head:`${q.name} ${pb.id||''} · ${sym.split('.')[1]||sym}`, lines});
  });
  return groups;
}

function fillRiskDefaults(onlySym){
  const sym=document.getElementById('rk-sym').value;
  const q=state.quotes[sym], pb=state.pbBySymbol?.[sym]||{}, pl=pb.plan||{};
  if(!q||!q.last) return;
  if(onlySym && document.getElementById('rk-entry').value) return;
  const price=q.last;
  // 方向: 剧本偏空则止损在上、目标在下; 偏多反之; 观望按价格相对剧本位自行判断
  const _D=dynDir(sym);
  const dir = _D?_D.level:(pl.stop>price?'short':'long');
  const stops=[pl.stop].filter(v=>v&&(dir==='short'? v>price : v<price));
  const tgts=[pl.waveTarget,pl.trendTarget].filter(v=>v&&(dir==='short'? v<price : v>price))
              .sort((a,b)=>Math.abs(a-price)-Math.abs(b-price));
  document.getElementById('rk-entry').value=price;
  document.getElementById('rk-stop').value = stops.length? stops[0] : '';
  document.getElementById('rk-tgt').value = tgts.length? tgts[0] : '';
}
function calcRisk(){
  const out=document.getElementById('rk-out'), warnBox=document.getElementById('rk-warn');
  if(!out) return;
  const acct=+document.getElementById('rk-acct').value;
  const riskPct=+document.getElementById('rk-risk').value/100;
  const sym=document.getElementById('rk-sym').value;
  const pb=state.pbBySymbol?.[sym]||{};
  const e=+document.getElementById('rk-entry').value, s=+document.getElementById('rk-stop').value, t=+document.getElementById('rk-tgt').value;
  if(!acct||!e||!s||e===s){ out.innerHTML='<div class="sub">填入入场与止损价后自动计算手数、保证金与盈亏比</div>'; warnBox.innerHTML=''; return; }
  const pv=pb.pointValue||5, pm=pb.priceMult||1, cu=pb.contractUnit||5;
  const riskYuan=acct*riskPct;
  const perLot=Math.abs(e-s)*pv;
  const lots=Math.max(0, Math.floor(riskYuan/perLot));
  const margin=lots*e*pm*cu*0.12;
  const marginPct=margin/acct*100;
  const rr=t? Math.abs(t-e)/Math.abs(e-s) : null;
  const atr=atr14(sym);
  const stopDist=Math.abs(e-s);
  const hit=[]; const warns=[];
  if(marginPct>20) warns.push(`单品种保证金占用 ${marginPct.toFixed(1)}% 已超 20% 上限`);
  if(atr && stopDist < 0.5*atr) warns.push(`止损距离 ${stopDist.toFixed(1)} < 0.5×ATR(${atr.toFixed(1)})，易被噪音扫损`);
  if(rr!=null && rr<2) warns.push(`盈亏比 ${rr.toFixed(2)} 不足 2:1`);
  if(atr && t && Math.abs(t-e) < atr) warns.push(`剧本目标距现价仅 ${Math.abs(t-e).toFixed(0)} 点（<1×ATR），剧本位可能已过期，建议按当前摆动结构重设目标`);
  if(!lots) warns.push('按该止损距离，一手都不足 1 手仓位，需放大账户或缩紧风险比例');
  const cell=(k,v,cls='')=>`<div><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  out.innerHTML = cell('单手风险', perLot.toFixed(0)+' 元')
    + cell('可开手数', lots+' 手', lots>0?'':'warn')
    + cell('占用保证金', (margin/1e4).toFixed(1)+' 万', marginPct>20?'warn':'')
    + cell('保证金占比', marginPct.toFixed(1)+'%', marginPct>20?'warn':'')
    + cell('止损距离', stopDist.toFixed(1)+' 点'+(atr?` / ATR ${atr.toFixed(1)}`:''))
    + cell('盈亏比', rr==null?'--':rr.toFixed(2)+' : 1', rr!=null&&rr<2?'warn':'')
    + cell('若止损', `-${(lots*perLot/1e4).toFixed(2)} 万（${(lots*perLot/acct*100).toFixed(2)}%）`);
  warnBox.innerHTML = warns.length? warns.map(w=>`<span class="warnbox">⚠ ${w}</span>`).join('') : '<span class="sub">按当前参数，仓位与止损均在纪律范围内</span>';
}

      <span class="sub">${n.ts}</span>
      <span class="del" data-id="${n.id}">✕</span></div>`;
  }).join('') : '<div class="sub">暂无消息记录</div>';
  box.querySelectorAll('.del').forEach(el=>el.onclick=()=>{
    saveNotes(loadNotes().filter(n=>n.id!=+el.dataset.id)); renderNewsList();
  });
}

/* ---------- WebSocket ---------- */
function connect(){
  const ws=new WebSocket(`ws://${location.hostname}:8765`);
  ws.onopen=()=>setConn(true);
  ws.onclose=()=>{ setConn(false); setTimeout(connect,3000); };
  ws.onerror=()=>ws.close();
  ws.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    document.getElementById('srvtime').textContent='行情时间 '+m.server_time;
    if(m.type==='init'){
      state.quotes=m.quotes; state.klines=m.klines;
      state.pbBySymbol={};
      (m.playbooks?.playbooks||[]).forEach(p=>{ if(p.symbol) state.pbBySymbol[p.symbol]=p; });
      state.confirmBars=m.playbooks?.confirmBars||3;
      state.nearPct=m.playbooks?.nearPct||0.01;
      state.season=m.seasonality||null;
      state.sino=m.sino||null;
      state.lz=m.lz||null;
      state.zc=m.zc||null;
      state.ms=m.ms||null;
      syncAuto(m.autoSignals, true);   // 建基线: 已成立的不重复响铃
      renderSeason();
      if(document.getElementById('tab-brief')?.style.display!=='none') renderBriefs();
      if(document.getElementById('tab-spread')?.style.display!=='none') renderSpread();
      state.order=(m.playbooks?.playbooks||[]).map(p=>p.symbol).filter(s=>s&&m.quotes[s]);
      if(!state.order.length) state.order=Object.keys(m.quotes);
      const opts=state.order.map(s=>`<option value="${s}">${m.quotes[s].name} ${s.split('.')[1]||''}</option>`).join('');
      if(document.getElementById('pl-sym').innerHTML!==opts){
        document.getElementById('pl-sym').innerHTML=opts;
        document.getElementById('j-code').innerHTML=opts;
      }
      // 重建骨架 (品种集合可能变化), 先释放旧图表
      Object.values(state.charts).forEach(c=>{ try{c.dispose();}catch(e){} });
      state.charts={}; state.lastDraw={};
      buildGrid();
      renderTicker();
      renderForceBoard();   // 首连即渲染，等行情推送后由 renderAll 持续刷新
    } else {
      for(const s in m.quotes){
        const prev=state.quotes[s]?.last;
        checkPriceLines(s,prev,m.quotes[s].last);
      }
      state.quotes=m.quotes;
      if(m.sino) state.sino=m.sino;
      if(m.lz) state.lz=m.lz;
      if(m.zc) state.zc=m.zc;
      if(m.ms) state.ms=m.ms;
      if(m.autoSignals) syncAuto(m.autoSignals, false);
      for(const s in m.klines) for(const p in m.klines[s]){
        const incoming=m.klines[s][p], cur=state.klines[s]?.[p]||[];
        for(const row of incoming){
          const idx=cur.findIndex(r=>r[0]===row[0]);
          if(idx>=0) cur[idx]=row; else cur.push(row);
        }
        state.klines[s][p]= cur.length>600? cur.slice(-600) : cur;
      }
      renderAll();
      if(Date.now()-lastPanel>3000){
        lastPanel=Date.now();
        if(document.getElementById('tab-brief')?.style.display!=='none') renderBriefs();
        if(document.getElementById('tab-spread')?.style.display!=='none') renderSpread();
      }
    }
  };
}

/* ---------- 悬停说明浮层：接管全站原生 title ----------
   做法：mouseover 时把 title 暂存到 data-wbtip 并把 title 置空（空 title 浏览器不弹，但属性还在，
   所以 .badge[data-wbtip] / .lv[data-wbtip] 的 cursor:help 仍然有效）；mouseout 再还原。
   渲染规则：
     · 第一行 = 标题；含「｜」的话把每段拆成「文字 数值」胶囊
     · 其余行若形如「键：值」（键 ≤5 字）走两列对齐，否则整行通排
     · 空行 = 分隔线
   浮层跟随光标，右/下越界自动翻到左/上；内容更新（行情每 tick 刷新 title）时用 200ms 轮询同步。 */
(function(){
  const tip=document.createElement('div');
  tip.id='wbtip';
  tip.innerHTML='<div class="bar"></div><div class="bd"></div>';
  document.body.appendChild(tip);
  const bd=tip.querySelector('.bd'), bar=tip.querySelector('.bar');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 色条跟着语义走：红=多/正面/风险，绿=空/负面，黄=中性；淡红/淡绿=中性里带方向
  const ACCENT=[['b-stop','#C93B3B'],['b-fired','#C93B3B'],['b-strongup','#C93B3B'],
                ['alarm','#C93B3B'],['b-pos','#C93B3B'],['b-weakup','#C08A80'],
                ['b-mildup','#D5A79E'],
                ['b-confirm','#E8952B'],['armed','#E8952B'],
                ['b-near','#C08A12'],['b-neu','#C08A12'],
                ['b-hold','#C08A12'],['b-watch','#C08A12'],
                ['b-neg','#2E7D32'],['b-negDeep','#1F5C29'],['b-firedS','#2E7D32'],
                ['b-strongdn','#2E7D32'],['b-weakdn','#7FA98B'],['b-milddn','#A6C3AC'],
                ['b-weak','#9A9384']];
  function accentOf(el){
    for(const [c,col] of ACCENT) if(el.classList.contains(c)) return col;
    if(el.classList.contains('lv')){
      if(el.classList.contains('res'))    return '#C93B3B';
      if(el.classList.contains('sup'))    return '#C08A12';
      if(el.classList.contains('strong')) return '#3B6D11';
      if(el.classList.contains('tgt'))    return '#2E7D32';
    }
    if(el.classList.contains('seas')) return '#A9852F';
    return '#C9C4B6';
  }
  function build(text){
    const lines=text.replace(/\r/g,'').split('\n').map(s=>s.trim());
    let html='';
    lines.forEach((ln,i)=>{
      if(!ln){ if(i) html+='<div class="hr"></div>'; return; }
      const pill=ln.split(/\s*｜\s*/);
      if(i===0){
        html+='<div class="hd">'+pill.map(p=>{
          const m=p.match(/^(.*?)\s([+\-]?[\d][\d.,]*%?)$/);     // 「第一支撑 3266」→ 文字 + 数值
          return m?`<span class="pg">${esc(m[1])}<em>${esc(m[2])}</em></span>`:`<span>${esc(p)}</span>`;
        }).join('')+'</div>';
        return;
      }
      const kv=ln.match(/^([^：:]{1,5})[：:]\s*(.+)$/);
      html+= kv
        ? `<div class="rw"><span class="k">${esc(kv[1])}</span><span class="v">${esc(kv[2])}</span></div>`
        : `<div class="li">${esc(ln)}</div>`;
    });
    return html;
  }
  let cur=null, timer=0, syncT=0, hideT=0, mx=0, my=0, lastText='';
  function place(){
    const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
    let x=mx+pad, y=my+pad+2;
    if(x+w>innerWidth-8) x=mx-w-pad;
    if(x<8) x=8;
    if(y+h>innerHeight-8) y=my-h-pad;
    if(y<8) y=8;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  function paint(el){
    const t=el.dataset.wbtip||'';
    if(!t) return hide(true);
    bar.style.setProperty('--ac', accentOf(el));
    // 文本没变就不重写 DOM：行情每秒重绘时占位不变，重写会造成可见的闪一下
    if(t!==lastText){ bd.innerHTML=build(t); lastText=t; }
    tip.classList.add('on');
    place();
  }
  // 光标下当前有 title 的元素。卡片是整块 innerHTML 重绘的，旧节点每秒被换掉，
  // 必须按坐标重新命中新节点，否则元素一换就 hide → 浏览器补发 mouseover → 再显示 = 一直闪。
  function hovered(){
    const hit=document.elementFromPoint(mx,my);
    return hit?.closest?.('[data-wbtip]') || null;
  }
  function adopt(el){
    const t=el.dataset.wbtip || '';
    if(!t) return false;
    cur=el; paint(el);
    if(!syncT) syncT=setInterval(sync,200);
    return true;
  }
  function hide(force){
    clearTimeout(hideT); clearTimeout(timer);
    if(!force){
      const el=hovered();                                   // 旧元素被重绘换掉 → 接管新的，不隐藏
      if(el && el!==cur && adopt(el)) return;
    }
    clearInterval(syncT); syncT=0; cur=null; lastText='';
    tip.classList.remove('on');
  }
  function hideSoon(){ clearTimeout(hideT); hideT=setTimeout(()=>hide(false),120); }
  // 行情每 tick 都会重写 title：悬停期间把新 title 吃进来，别让浮层显示旧价位。
  // 同时必须把 title 再清掉——只吃不清的话，元素顶着 title 停留超过 1 秒，浏览器
  // 自己那个灰色原生悬浮窗就会跟着弹出来（技术口径/季节性/徽标都踩过这个）。
  function sync(){
    if(!cur) return;
    if(!document.contains(cur)){
      const el=hovered();
      if(!el || !adopt(el)) hide(true);
      return;
    }
    // 光标还在这条提示上吗？不只靠 mouseout —— 节点被重绘换掉、指针一路滑过一串
    // 子元素时，mouseout 有概率漏发，浮层就会黏在屏幕上不动。按坐标再确认一次：
    // 光标下换成别的元素就接管它，什么都没有就收起。
    const under=document.elementFromPoint(mx,my);
    const hit=under?.closest?.('[data-wbtip]') || null;
    if(hit!==cur){
      if(hit && adopt(hit)) return;
      return hide(true);
    }
    const t=cur.dataset.wbtip||'';
    if(!t) return hide(true);
    paint(cur);
  }
  document.addEventListener('mouseover', e=>{
    clearTimeout(hideT);
    const el=e.target.closest?.('[data-wbtip]');
    if(!el || el===cur) return;
    clearTimeout(timer);
    timer=setTimeout(()=>{
      if(!el.isConnected || !el.matches(':hover')) return;
      adopt(el);
    },120);
  }, {passive:true});
  document.addEventListener('mouseout', e=>{
    const el=e.target.closest?.('[data-wbtip]');
    if(!el) return;
    if(e.relatedTarget && el.contains(e.relatedTarget)) return;
    if(el===cur) hideSoon();
  }, {passive:true});
  document.addEventListener('mousemove', e=>{
    mx=e.clientX; my=e.clientY;
    if(cur) place();
  }, {passive:true});
  document.addEventListener('mousedown', ()=>hide(true), {passive:true});
  window.addEventListener('scroll', ()=>hide(true), {passive:true, capture:true});
  window.addEventListener('blur', ()=>hide(true));
})();

/* 主线/基差/季节性/技术位：默认收起，点一行开弹层看详情（内容仍在隐藏容器里，每 tick 更新） */
(function(){
  const mask=document.getElementById('tmodal');
  const bd=document.getElementById('tmodal-bd');
  const ttl=document.getElementById('tmodal-title');
  if(!mask) return;
  const close=()=>mask.classList.remove('on');
  document.addEventListener('click', e=>{
    const bar=e.target.closest?.('.thesisbar');
    if(bar){
      const sym=bar.id.replace('thesisbar-','');
      const src=document.getElementById('thesis-'+sym);
      if(!src) return;
      const plan=document.getElementById('planline-'+sym);
      const pb=state.pbBySymbol?.[sym];
      ttl.textContent=(pb?.name||sym)+' · 机位 / 主线 / 基差 / 季节性 / 技术位';
      const strip=h=>String(h||'').replace(/\sid="[^"]*"/g,'');   // 剥 id：副本不能和卡片里同名节点打架
      bd.innerHTML=(plan?strip(plan.innerHTML)+'<br>':'')+strip(src.innerHTML);
      mask.classList.add('on');
      return;
    }
    if(e.target===mask || e.target.closest?.('#tmodal-x')) close();
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && mask.classList.contains('on')) close(); });
})();
